# Each share's sector and industry from EODData's profiles into the private store (svr-net/eod,
# profiles/<EXCHANGE>.json), for the model's industry groups; prints only counts. With probe, also
# whether the key reaches the fundamentals (counts only).
name: Profiles (sectors and industries)
on:
  workflow_dispatch:
    inputs:
      exchanges: { description: 'Exchanges', default: 'LSE,NYSE,NASDAQ' }
      probe: { description: 'Also probe the fundamentals (counts only)', type: boolean, default: true }
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ofm-tools
      - name: The EOD store (svr-net/eod, libgit2)
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: mkdir -p data && ofm ofm_eod sync --dir data/eoddata
      - name: Profiles
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: ofm ofm_eod profiles --exchanges "${{ inputs.exchanges }}" --out data/eoddata/profiles ${{ inputs.probe && '--probe' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Store them (svr-net/eod, libgit2)
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: ofm ofm_eod push --dir data/eoddata --message "Profiles $(date -u +%Y-%m-%d)" | tee -a "$GITHUB_STEP_SUMMARY"
