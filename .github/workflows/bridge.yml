# The bridge watched from outside: its state read from GitHub's runners (tools/ibkr/monitor.mjs) on
# weekdays during the UK and EU sessions and on demand. No prices, keys or account numbers are
# printed (this repository's logs are public). BRIDGE_URL defaults to the NAS's address; the
# BRIDGE_KEY secret (optional) adds the diagnostics.
name: Bridge monitor
on:
  workflow_dispatch:
    inputs:
      bars: { description: "Also fetch this market's daily bars from IBKR into the store (UK, EU, US, APAC; about an hour, in the background)", default: '' }
      restart: { description: "Restart IB Gateway first (then wait 4 minutes for it to log in)", type: boolean, default: false }
      place: { description: "Then place these markets' orders again, e.g. UK,EU (already placed shares are skipped)", default: '' }
      test_order: { description: "Then ask IBKR whether it accepts orders now: a 1-share limit buy far from the market, cancelled at once (UK, EU, US, APAC or INDEX)", default: '' }
  schedule:
    - cron: '7,37 * * * 0-5'   # UTC, every half hour Sunday night to Friday: every market's session (APAC's from Sunday 22:00), the closes and reports
permissions:
  contents: write  # web/data/broker.json (results only) to main when the broker's state changes
  actions: write   # the previous run's result (a failure pushed once a day, not every half hour); the page redeployed
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history: is the NAS's bridge the latest?
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IBKR's daily bars for a market (on demand)
        if: inputs.bars != ''
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL || 'https://svrnet.synology.me:8765' }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          MARKET: ${{ inputs.bars }}
        run: |
          case "$MARKET" in UK|EU|US|APAC) ;; *) echo "unknown market $MARKET"; exit 1;; esac
          curl -sS --max-time 60 -X POST "$BRIDGE_URL/bars" -H 'Origin: https://svr-net.github.io' -H "X-Bridge-Key: $BRIDGE_KEY" \
            -H 'Content-Type: application/json' -d "{\"market\": \"$MARKET\"}" | tee -a "$GITHUB_STEP_SUMMARY"; echo
      - name: Restart IB Gateway (on demand)
        if: inputs.restart
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL || 'https://svrnet.synology.me:8765' }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        run: |
          curl -sS --fail-with-body --max-time 200 -X POST "$BRIDGE_URL/restart" -H 'Origin: https://svr-net.github.io' -H "X-Bridge-Key: $BRIDGE_KEY" \
            -H 'Content-Type: application/json' -d '{}' | tee -a "$GITHUB_STEP_SUMMARY"; echo
          echo "waiting 4 minutes for IB Gateway to log in"; sleep 240
      - name: Place orders again (on demand)
        if: inputs.place != ''
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL || 'https://svrnet.synology.me:8765' }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          MARKETS: ${{ inputs.place }}
        run: |
          for m in $(echo "$MARKETS" | tr ',a-z' ' A-Z'); do
            case "$m" in UK|EU|US|APAC|INDEX) ;; *) echo "unknown market $m"; exit 1;; esac
            curl -sS --max-time 120 -X POST "$BRIDGE_URL/place" -H 'Origin: https://svr-net.github.io' -H "X-Bridge-Key: $BRIDGE_KEY" \
              -H 'Content-Type: application/json' -d "{\"market\": \"$m\"}" | tee -a "$GITHUB_STEP_SUMMARY"; echo
          done
          echo "waiting 3 minutes for the placing to finish"; sleep 180
      - name: Test order (on demand)
        if: inputs.test_order != ''
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL || 'https://svrnet.synology.me:8765' }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          MARKET: ${{ inputs.test_order }}
        run: |
          case "$MARKET" in UK|EU|US|APAC|INDEX) ;; *) echo "unknown market $MARKET"; exit 1;; esac
          curl -sS --max-time 200 -X POST "$BRIDGE_URL/test-order" -H 'Origin: https://svr-net.github.io' -H "X-Bridge-Key: $BRIDGE_KEY" \
            -H 'Content-Type: application/json' -d "{\"market\": \"$MARKET\"}" | jq -c 'del(.result.at)' | sed -E 's/[0-9]+\.[0-9]{2,}/#/g; s/\b[DU][0-9]{5,}\b/ACCOUNT/g' | tee -a "$GITHUB_STEP_SUMMARY"; echo
      - name: The bridge's state
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_URL || 'https://svrnet.synology.me:8765' }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          BROKER_OUT: broker.json
          BROKER_PREV: web/data/broker.json
        # pipefail: a failure the monitor finds turns the run red (and GitHub emails); without it tee's
        # success hid every one (3 Nov: the EU close failed, every run green).
        shell: bash
        run: |
          set -o pipefail
          LATEST=$(git log -1 --format=%h --abbrev=7 -- tools/ibkr/java tools/ibkr/java-test docker/ibkr/Dockerfile.ibkr docker/ibkr/ibkr-start.sh .github/workflows/bridge-image.yml) node tools/ibkr/monitor.mjs | tee monitor.txt | tee -a "$GITHUB_STEP_SUMMARY"
      # The broker's state on the page (web/data/broker.json: whether IBKR refuses the orders, since when, and
      # how many shares each market's account holds; no prices, amounts or account numbers). Committed only
      # when it changed (its check time aside), so the half-hourly runs do not fill main's history.
      - name: Publish the broker's state to the page (when it changed)
        if: always() && hashFiles('broker.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          same() { [ -f web/data/broker.json ] && [ "$(jq -cS 'del(.checked)' broker.json)" = "$(jq -cS 'del(.checked)' web/data/broker.json)" ]; }
          if same; then echo "broker state unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for k in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            if same; then echo "broker state unchanged"; exit 0; fi
            cp broker.json web/data/broker.json
            git add web/data/broker.json
            git commit -q -m "Broker state $(date -u +'%Y-%m-%d %H:%M') (results only)"
            git push -q origin HEAD:main && break
            sleep $((k * 5))
          done
          gh workflow run pages.yml --ref main
      # A push to the phone (ntfy.sh: install the ntfy app and subscribe to the topic in the NTFY_TOPIC
      # secret, a long random name). Sent on the first failing run of each day and whenever a passing run
      # turns into a failing one, so a problem that lasts is repeated daily instead of every half hour.
      - name: Push the failure to the phone
        if: failure() && env.NTFY_TOPIC != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prev=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bridge.yml/runs?status=completed&per_page=1" \
            | python3 -c 'import json,sys; r=(json.load(sys.stdin).get("workflow_runs") or [{}])[0]; print(r.get("conclusion",""), (r.get("created_at") or "")[:10])')
          read -r was day <<< "$prev"
          if [ "${{ github.event_name }}" = schedule ] && [ "$was" = failure ] && [ "$day" = "$(date -u +%F)" ]; then
            echo "already pushed today for this failure"; exit 0
          fi
          msg=$(grep -h 'NEEDS ATTENTION' monitor.txt 2>/dev/null | sed 's/^NEEDS ATTENTION: //'); msg=${msg:-the monitor run failed}
          curl -sS --max-time 30 -H 'Title: Trading bridge needs attention' -H 'Priority: high' -H 'Tags: warning' \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-binary "$msg" "https://ntfy.sh/$NTFY_TOPIC"
