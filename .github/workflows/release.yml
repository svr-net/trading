name: Release

# Publishes a GitHub release with the copy-deployable standalone site, either by pushing a
# tag that matches the CMake project version (e.g. v0.1.0), or by running this workflow
# manually on main, which creates that tag on the tested commit. Either way the full CI runs
# first, and the zip attached to the release is the one CI built and tested.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the release tag
        id: tag
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project VERSION ${version} in CMakeLists.txt"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Manual releases run from main only (got ${GITHUB_REF})"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists: bump VERSION in CMakeLists.txt for a new release"
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: trading-sat-standalone
          path: dist
      - name: Package release assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd dist
          asset="trading-sat-standalone-${TAG}.zip"
          mv trading-sat-standalone.zip "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
          cat "${asset}.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: trading SAT ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/trading-sat-standalone-${{ steps.tag.outputs.tag }}.zip
            dist/trading-sat-standalone-${{ steps.tag.outputs.tag }}.zip.sha256
          body: |
            Self-adaptive machine-learning trading library (C++17), modelling *Predicting Stock Prices Based on Machine Learning to Build Self-adaptive Trading Strategy* (Wang, Huang and Luo, Computational Economics, 2025), with pipeline options from *Advances in Financial Machine Learning* (López de Prado, Wiley, 2018) and a WebAssembly + WebGPU front end.

            ### Standalone site: `trading-sat-standalone-${{ steps.tag.outputs.tag }}.zip`
            Unzip it anywhere and open `index.html`. It needs no server and no install, because the WebAssembly library is embedded in the bundle.
            The same folder can be uploaded unchanged to any static host (S3, GitHub Pages, nginx, IIS).
            It has 10 pages, one per stage of the self-adaptive pipeline: core numerics, market data, alpha factors, labels, machine-learning models and their composite forecast, fixed strategies, the self-adaptive strategy, robustness, and the WebGPU strategy search. By default the selector trades the equal-weight average of the two models chosen by an ablation study, through five trading rules.
            The strategy pages run the backtests and selectors on WebGPU kernels whenever the browser supports WebGPU (the *Auto* engine), and on WebAssembly otherwise.
            Verify the download with the attached `.sha256` file.

            ### From source
            - `cmake -S . -B build && cmake --build build && ctest --test-dir build` builds the native library and runs its tests.
            - `docker build -t trading-sat . && docker run -p 8080:80 trading-sat` builds the site and serves it on nginx.

            Before this release was published, the full CI passed on this tag: GCC and Clang builds, sanitizers, the WebAssembly build, browser tests of every page (including the zip's contents opened from `file://`), and the Docker images.
