name: Delete merged branches

# Deletes a pull request's branch once it is merged, and on demand every branch already merged
# into main, plus the branches named (stale ones not merged; main is always kept).
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branches: { description: 'Also delete these branches (comma separated; never main)', default: '' }
      runs: { description: 'Also delete these workflow runs, logs and summaries (ids, comma separated)', default: '' }

permissions:
  contents: write
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete the merged pull request's branch
        if: github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push origin --delete "$BRANCH" || echo "$BRANCH is already gone"
      - name: Delete every branch merged into main
        if: github.event_name == 'workflow_dispatch'
        env:
          NAMED: ${{ inputs.branches }}
        run: |
          git fetch --prune origin
          git branch -r --merged origin/main | sed 's#^ *origin/##' | grep -v -E '^(main|HEAD)( |$)' | while read -r b; do
            git push origin --delete "$b" && echo "deleted $b"
          done
          printf '%s\n' "$NAMED" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v -E '^(main|HEAD|)$' | while read -r b; do
            git push origin --delete "$b" && echo "deleted $b" || echo "$b: not found"
          done
      - name: Delete the workflow runs named
        if: github.event_name == 'workflow_dispatch' && inputs.runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        run: |
          printf '%s\n' "$RUNS" | tr ',' '\n' | tr -dc '0-9\n' | grep . | while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" && echo "deleted run $id" || echo "run $id: not deleted"
          done
