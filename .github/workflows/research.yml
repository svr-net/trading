# Research: the model's walk-forward backtest in several variants side by side, on the private store's
# bars (svr-net/eod), for one market. Results only (the backtest's summary lines): no prices, no orders,
# nothing published or pushed. Each variant is a set of research switches (X_ environment variables
# of apps/ofm_research) and/or a filter on the share list.
name: Research (model variants)

on:
  workflow_dispatch:
    inputs:
      market: { description: 'Market', type: choice, options: [EU, UK, US, APAC, INDEX, FOREX], default: EU }
      variants: { description: 'Variants (comma separated; see the list in the workflow)', default: 'base,npick5,npick20,ridge,par,ams,no-osl,liquid' }

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.v.outputs.list }}
    steps:
      - id: v
        run: echo "list=$(echo '${{ inputs.variants }}' | tr -d ' ' | jq -Rc 'split(",")')" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      MARKET: ${{ inputs.market }}
      EXCHANGES: ${{ inputs.market == 'US' && 'NYSE,NASDAQ' || inputs.market == 'APAC' && 'ASX,SGX' || inputs.market == 'EU' && 'PAR,AMS,BRU,LIS,MSE,FRA' || inputs.market == 'INDEX' && 'INDEX' || inputs.market == 'FOREX' && 'FOREX' || 'LSE' }}
      # INDEX and FOREX: named series (EODData's codes), traded through an index fund (INDEX) or IBKR's spot FX.
      SERIES: ${{ inputs.market == 'INDEX' && 'INDEX:DJI,INDEX:COMP,INDEX:OEX,INDEX:NYA,INDEX:SML,INDEX:SPXE,INDEX:CAC,INDEX:DAX,INDEX:AEX,INDEX:IBEX,INDEX:AXJO,INDEX:HSI' || inputs.market == 'FOREX' && 'FOREX:EURUSD,FOREX:GBPUSD,FOREX:USDJPY,FOREX:USDCHF,FOREX:AUDUSD,FOREX:USDCAD,FOREX:NZDUSD,FOREX:EURGBP,FOREX:EURJPY,FOREX:GBPJPY,FOREX:EURCHF,FOREX:AUDJPY,FOREX:EURAUD,FOREX:EURCAD,FOREX:GBPCHF,FOREX:CHFJPY,FOREX:CADJPY,FOREX:AUDNZD,FOREX:EURNZD,FOREX:GBPAUD' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The share bars are the same for every variant of a market on a day: the first job builds them, the
      # others restore them (GitHub's cache, private to this repository) and skip the store and the build.
      - name: The day
        run: echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: The day's share bars, if another job built them (only on a work branch, whose caches pull requests from forks cannot read)
        id: bars
        if: github.ref != 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: data/bars-all.csv
          key: research-bars-${{ inputs.market }}-${{ env.DAY }}-live
      - name: Check out the EOD store (svr-net/eod)
        if: steps.bars.outputs.cache-hit != 'true' || matrix.variant == 'delay' || matrix.variant == 'intraday' || matrix.variant == 'swing' || contains(matrix.variant, 'ibkr') || startsWith(matrix.variant, 'single') || startsWith(matrix.variant, 'hold') || startsWith(matrix.variant, 'mom')
        uses: actions/checkout@v4
        with:
          repository: svr-net/eod
          token: ${{ secrets.EOD_TOKEN }}
          path: data/eoddata
          fetch-depth: 1
      - name: The share bars (as the daily run builds them)
        if: steps.bars.outputs.cache-hit != 'true'
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p data
          echo 'date,ticker,open,high,low,close,volume' > data/stocks.csv
          if [ -n "$SERIES" ]; then node tools/eoddata/fetch_series.mjs --symbols "$SERIES" --years 20 --out data/series.csv; tail -n +2 data/series.csv >> data/stocks.csv; fi
          for EX in $( [ -n "$SERIES" ] || echo "$EXCHANGES" | tr ',' ' '); do
            case "$EX" in LSE) CUR=GBP;; ASX) CUR=AUD;; SGX) CUR=SGD;; OSL) CUR=NOK;; PAR|AMS|BRU|LIS|MSE|FRA) CUR=EUR;; *) CUR="";; esac
            node tools/eoddata/fetch.mjs --exchange "$EX" --universe "$([ "$MARKET" = US ] && echo 2000 || ([ "$MARKET" = EU ] && echo 300 || echo 500))" --years 9 --currency "$CUR" --out "data/$EX.csv" > /dev/null
            case "$MARKET" in EU|APAC) tail -n +2 "data/$EX.csv" | awk -F, -v OFS=, -v ex="$EX" '{$2=ex":"$2; print}' >> data/stocks.csv;; *) tail -n +2 "data/$EX.csv" >> data/stocks.csv;; esac
          done
      - name: The variant's share list
        run: |
          if [ -f data/bars-all.csv ] && [ ! -f data/stocks.csv ]; then cp data/bars-all.csv data/stocks.csv; else cp data/stocks.csv data/bars-all.csv; fi
          V='${{ matrix.variant }}'
          keep() { { head -1 data/stocks.csv; tail -n +2 data/stocks.csv | awk -F, "$1"; } > data/v.csv && mv data/v.csv data/stocks.csv; }
          case "$V" in
            par) keep '$2 ~ /^PAR:/' ;;
            ams) keep '$2 ~ /^AMS:/' ;;
            no-osl) keep '$2 !~ /^OSL:/' ;;
            no-osl-ams) keep '$2 !~ /^(OSL|AMS):/' ;;
            par-bru) keep '$2 ~ /^(PAR|BRU):/' ;;
            no-osl-ams-n5) keep '$2 !~ /^(OSL|AMS):/' ;;
            liquid)  # each exchange's 100 most traded shares (by their median daily traded value)
              tail -n +2 data/stocks.csv | awk -F, '{split($2,a,":"); v[$2]+=$6*$7; n[$2]++; ex[$2]=a[1]} END {for (t in v) print ex[t], v[t]/n[t], t}' \
                | sort -k1,1 -k2,2gr | awk '{c[$1]++; if (c[$1] <= 100) print $3}' > data/keep.txt
              { head -1 data/stocks.csv; tail -n +2 data/stocks.csv | awk -F, 'NR==FNR {k[$1]=1; next} k[$2]' data/keep.txt -; } > data/v.csv && mv data/v.csv data/stocks.csv ;;
          esac
          # Combinable tokens (variant = tokens joined by +): noamsosl, the share list without Amsterdam and Oslo.
          case "+$V+" in *+noamsosl+*) keep '$2 !~ /^(OSL|AMS):/' ;; esac
          # drop<k>s<seed>: a robustness check, k% of the shares left out at random (a hash of the ticker and
          # the seed), so the backtest's dependence on exactly which shares are in the list can be measured.
          for tok in $(echo "$V" | tr '+' ' '); do case "$tok" in drop[0-9]*s[0-9]*)
            k="${tok#drop}"; k="${k%%s*}"; seed="${tok##*s}"
            keep "BEGIN { for (c = 32; c < 127; c++) ord[sprintf(\"%c\", c)] = c } { h = $seed; for (j = 1; j <= length(\$2); j++) h = (h * 31 + ord[substr(\$2, j, 1)]) % 1000003; if (h % 100 >= $k) print }";; esac; done
          # noosl: without Oslo, the live EU universe (no trading permission there).
          case "+$V+" in *+noosl+*) keep '$2 !~ /^OSL:/' ;; esac
          # The variant's share list in numbers (as the daily run's summary): to set beside the live scan's.
          echo "share list: rows $(($(wc -l < data/stocks.csv) - 1)), symbols $(tail -n +2 data/stocks.csv | cut -d, -f2 | sort -u | wc -l), $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort -u | sed -n '1p;$p' | paste -sd' ' | sed 's/ / to /')" | tee -a "$GITHUB_STEP_SUMMARY"
          case "+$V+" in *+noosl+*) keep '$2 !~ /^OSL:/' ;; esac
          # Token aim (UK): only AIM shares (no stamp duty), from tools/eoddata/aim.txt.
          case "+$V+" in *+aim+*) { head -1 data/stocks.csv; tail -n +2 data/stocks.csv | awk -F, 'NR==FNR {k[$1]=1; next} k[$2]' tools/eoddata/aim.txt -; } > data/v.csv && mv data/v.csv data/stocks.csv ;; esac
          echo "shares: $(tail -n +2 data/stocks.csv | cut -d, -f2 | sort -u | wc -l), days: $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort -u | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the model
        run: |
          command -v ninja >/dev/null || sudo apt-get install -y --no-install-recommends ninja-build >/dev/null 2>&1 || echo "no Ninja (the package servers did not answer), building with Make"
          cmake -S . -B build $(command -v ninja >/dev/null && echo "-G Ninja")
          cmake --build build --target ofm_research ofm_delay ofm_anatomy ofm_swing ofm_single ofm_mc ofm_hold ofm_mom ofm_intraday
      - name: Delayed entry on the stored 5-minute bars (variant delay; results only)
        if: matrix.variant == 'delay'
        run: |
          set -o pipefail
          node tools/eoddata/intraday_export.mjs --exchanges "$EXCHANGES" --out data/intraday.csv
          ./build/ofm_delay --daily data/stocks.csv --bars data/intraday.csv --cost 0.004 | tee report.txt
          { echo "### $MARKET delay"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Intraday momentum on the stored 5-minute bars (variant intraday; results only)
        if: matrix.variant == 'intraday'
        run: |
          set -o pipefail
          node tools/eoddata/intraday_export.mjs --exchanges "$EXCHANGES" --out data/intraday.csv
          { ./build/ofm_intraday --intraday data/intraday.csv --csv data/stocks.csv --capital 5000; ./build/ofm_intraday --intraday data/intraday.csv --csv data/stocks.csv --capital 5000 --tiered; } | tee report.txt
          { echo "### $MARKET intraday"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Where the market's returns are and which kinds of strategy earn them (variant anatomy; results only)
        if: matrix.variant == 'anatomy'
        run: |
          set -o pipefail
          CAPITAL=5000
          A=(--csv data/stocks.csv --costs "$MARKET" --capital "$CAPITAL")
          case "$MARKET" in US) A+=(--min-price 5);; UK) A+=(--stamp-free tools/eoddata/aim.txt);; *) A+=(--venues tools/venues.txt);; esac
          for TOP in 500 100; do ./build/ofm_anatomy "${A[@]}" --top "$TOP"; done | tee report.txt
          { echo "### $MARKET anatomy"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The swing model, walk-forward (variant swing; results only)
        if: matrix.variant == 'swing'
        run: |
          set -o pipefail
          CAPITAL=5000
          A=(--csv data/stocks.csv --costs "$MARKET" --capital "$CAPITAL")
          case "$MARKET" in US) A+=(--min-price 5);; UK) A+=(--stamp-free tools/eoddata/aim.txt);; *) A+=(--venues tools/venues.txt);; esac
          # Beside the store's bars: the same with IBKR's own daily bars where the bridge fetched them
          # (their open is the opening auction's), to tell a real edge from a wrong open in the data.
          IB=data/eoddata/ibkr/$MARKET/daily.csv
          { for TOP in 500 100; do ./build/ofm_swing "${A[@]}" --top "$TOP"; [ -f "$IB" ] && ./build/ofm_swing "${A[@]}" --top "$TOP" --override "$IB"; done; [ -f "$IB" ] || echo "swing: no IBKR bars for $MARKET in the store"; } | tee report.txt
          { echo "### $MARKET swing"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The single-share model, each share learnt and backtested on its own bars only (variant single[+tokens]; results only)
        if: startsWith(matrix.variant, 'single')
        run: |
          set -o pipefail
          CAPITAL=1000
          A=(--csv data/stocks.csv --costs "$MARKET" --capital "$CAPITAL")
          case "$MARKET" in UK) A+=(--stamp-free tools/eoddata/aim.txt);; EU|APAC) A+=(--venues tools/venues.txt);; INDEX|FOREX) A+=(--venues tools/venues-series.txt);; esac
          # The account (10 slots, as the live model), the store's bars against IBKR's own where the bridge fetched them.
          IB=data/eoddata/ibkr/$MARKET/daily.csv
          # IBKR's file in numbers (no prices): its rows, days, shares, and the tickers' shape beside the store's.
          [ -f "$IB" ] && echo "IBKR bars: rows $(($(wc -l < "$IB") - 1)), $(tail -n +2 "$IB" | cut -c1-10 | sort -u | sed -n '1p;$p' | paste -sd' ' | sed 's/ / to /'), shares $(tail -n +2 "$IB" | cut -d, -f2 | sort -u | wc -l), ticker shapes $(tail -n +2 "$IB" | cut -d, -f2 | sed 's/[A-Z0-9.]/x/g' | sort | uniq -c | sort -rn | head -3 | tr -s ' ' | paste -sd';'); the store's: $(tail -n +2 data/stocks.csv | cut -d, -f2 | sed 's/[A-Z0-9.]/x/g' | sort | uniq -c | sort -rn | head -3 | tr -s ' ' | paste -sd';')"
          # IBKR's coverage of the live pool by exchange (counts only): which exchanges' shares IBKR answers for.
          OF=data/eoddata/orders/$MARKET.json
          [ -f "$IB" ] && [ -f "$OF" ] && python3 tools/check/ibkr_coverage.py "$OF" "$IB"
          { for TOP in 300 100; do
              if [ -f "$IB" ]; then ./build/ofm_single "${A[@]}" --top "$TOP" --ibkr-days "$IB"; ./build/ofm_single "${A[@]}" --top "$TOP" --override "$IB"
              else ./build/ofm_single "${A[@]}" --top "$TOP"; echo "single: no IBKR bars for $MARKET in the store"; fi
            done; } | tee report.txt
          { echo "### $MARKET ${{ matrix.variant }}"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The single-share model's fills, stricter (variant single; results only)
        if: matrix.variant == 'single'
        run: |
          set -o pipefail
          A=(--csv data/stocks.csv --costs "$MARKET" --capital 1000 --top 300)
          case "$MARKET" in UK) A+=(--stamp-free tools/eoddata/aim.txt);; EU|APAC) A+=(--venues tools/venues.txt);; INDEX|FOREX) A+=(--venues tools/venues-series.txt);; esac
          for K in 1 2 4; do ./build/ofm_single "${A[@]}" --through "$K" | grep -E "spreads through|filled|the account"; done | tee report.txt
          { echo "### $MARKET single, stricter fills"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Momentum book, bought in opening auctions and held for months (variant mom[+tiered]; results only)
        if: startsWith(matrix.variant, 'mom')
        run: |
          set -o pipefail
          A=(--csv data/stocks.csv --costs "$MARKET" --budget 10000)
          case "$MARKET" in UK) A+=(--stamp-free tools/eoddata/aim.txt);; EU|APAC) A+=(--venues tools/venues.txt);; esac
          case "+${{ matrix.variant }}+" in *+tiered+*) A+=(--pricing tiered);; esac
          IB=data/eoddata/ibkr/$MARKET/daily.csv
          [ -s "$IB" ] && A+=(--override "$IB")
          { for TOP in 300 100; do ./build/ofm_mom "${A[@]}" --top "$TOP" --trades data/mom-$TOP.days
              ./build/ofm_mc --days data/mom-$TOP.days --trials 30 --keep 1 | grep -E "luck|a year"; done; } | tee report.txt
          { echo "### $MARKET ${{ matrix.variant }}"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Multi-day holds on the single-share model (variant hold[+tokens]; results only)
        if: startsWith(matrix.variant, 'hold')
        run: |
          set -o pipefail
          A=(--csv data/stocks.csv --costs "$MARKET" --capital 1000)
          case "$MARKET" in UK) A+=(--stamp-free tools/eoddata/aim.txt);; EU|APAC) A+=(--venues tools/venues.txt);; INDEX|FOREX) A+=(--venues tools/venues-series.txt);; esac
          # Token tiered: IBKR's tiered pricing (Europe: each venue's minimum at EUR 1.25, as in the backtest's token).
          case "+${{ matrix.variant }}+" in *+tiered+*) A+=(--pricing tiered)
            if [ "$MARKET" = EU ]; then awk '!/^#/ && NF >= 4 && $1 != "OSL" { $4 = ($4 > 1.25 ? 1.25 : $4) } { print }' tools/venues.txt > data/venues-tiered.txt; A+=(--venues data/venues-tiered.txt); fi;; esac
          IB=data/eoddata/ibkr/$MARKET/daily.csv
          [ -s "$IB" ] && [ "$(wc -l < "$IB")" -gt 1 ] && OV=(--override "$IB") || { OV=(); echo "hold: no IBKR bars for $MARKET in the store"; }
          {
            # The store's bars (IBKR's where it has them), the 300 and the 100 most traded; stricter fills;
            # and only the share-days with IBKR's own bars (the prices that traded: the honest test).
            for TOP in 300 100; do ./build/ofm_hold "${A[@]}" "${OV[@]}" --top "$TOP"; done
            ./build/ofm_hold "${A[@]}" "${OV[@]}" --top 300 --through 2
            if [ ${#OV[@]} -gt 0 ]; then ./build/ofm_hold "${A[@]}" "${OV[@]}" --top 300 --ibkr-only; fi
            # Token up: only Connors's exit on strength (the first close above the entry, at most the fifth).
            case "+${{ matrix.variant }}+" in *+up+*) for TOP in 300 100; do ./build/ofm_hold "${A[@]}" "${OV[@]}" --top "$TOP" --holds up; done
              if [ ${#OV[@]} -gt 0 ]; then ./build/ofm_hold "${A[@]}" "${OV[@]}" --top 300 --holds up --ibkr-only; fi;; esac
          } | tee report.txt
          { echo "### $MARKET ${{ matrix.variant }}"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The backtest (results only)
        if: matrix.variant != 'delay' && matrix.variant != 'intraday' && matrix.variant != 'anatomy' && matrix.variant != 'swing' && !startsWith(matrix.variant, 'single') && !startsWith(matrix.variant, 'hold') && !startsWith(matrix.variant, 'mom')
        run: |
          set -o pipefail
          V='${{ matrix.variant }}'
          case "$V" in
            npick5|no-osl-ams-n5) export X_NPICK=5 ;;
            npick15) export X_NPICK=15 ;;
            npick20) export X_NPICK=20 ;;
            ridge) export X_LEARN_RIDGE=1 ;;
          esac
          # Combinable tokens (variant = tokens joined by +): n<k> k trades a day, regime (deeper when the
          # market's range is wide), filln, sharedepth, fillnet, fullspread.
          for tok in $(echo "$V" | tr '+' ' '); do
            case "$tok" in
              n[0-9]*) export X_NPICK="${tok#n}" ;;
              regime) export X_REGIME=1 ;;
              fillN|filln) export X_FILLN=1 ;;  # the number of orders learnt from how often they fill
              sharedepth) export X_SHAREDEPTH=1 ;;  # each share's own limit depth, learnt (empirical Bayes)
              fillnet) export X_FILLNET=1 ;;
              fullspread) export X_FULLSPREAD=1 ;;  # every share buys and sells across half the spread (none uncross at one price)
              size) export X_SIZE=1 ;;  # each order's money by its calibrated expectation (meta-labeling's sizing)
              mc) export X_TRADELOG=data/tl.csv ;;
              maxd*) export X_MAXDEPTH="${tok#maxd}" ;;
              depthtable) export X_DEPTHTABLE=1 ;;  # every candidate at every depth: fills, a fill's and an order's return (a diagnostic)
              bychance) export X_BYCHANCE=1 ;;  # the day's orders chosen and sorted by their chance to buy
              balance) export X_BALANCE=1 ;;  # each share's depth where its chance to buy and to gain once bought are closest  # the deepest limit (sigmas below the close): maxd0, maxd0.5, maxd1  # the trade log and the days for the Monte Carlo below (local only)
            esac
          done
          STAMP=(--exit safety)
          CAPITAL=5000
          VENUES=tools/venues.txt
          # Token amount<k>: k a trade (the exchanges' own currencies) in place of tools/venues.txt's and the capital.
          for tok in $(echo "$V" | tr '+' ' '); do case "$tok" in amount[0-9]*)
            CAPITAL="${tok#amount}"; VENUES=data/venues.txt
            awk -v ex=",$EXCHANGES," -v k="$CAPITAL" '!/^#/ && index(ex, "," $1 ",") { $2 = k } { print }' tools/venues.txt > "$VENUES";; esac; done
          # Token tiered: IBKR's tiered pricing (the UK: 0.05%, at least GBP 1, with the exchange's and clearing
          # fees; the US: USD 0.0035 a share, at least 0.35; Europe: each venue's minimum lowered to EUR 1.25,
          # IBKR's tiered minimum on Euronext, an approximation: check IBKR's page before trading on it).
          PRICING=fixed
          case "+$V+" in *+tiered+*) PRICING=tiered
            awk '!/^#/ && NF >= 4 && $1 != "OSL" { $4 = ($4 > 1.25 ? 1.25 : $4) } { print }' "$VENUES" > data/venues-tiered.txt && VENUES=data/venues-tiered.txt;; esac
          case "$MARKET" in EU|APAC) STAMP+=(--venues "$VENUES");; esac
          if [ "$MARKET" = UK ]; then STAMP+=(--stamp-free tools/eoddata/aim.txt --segments tools/eoddata/lse_segments.csv); fi
          # Token ibkr: IBKR's own daily bars in place of the store's where the bridge fetched them.
          case "+$V+" in *+ibkr+*) [ -f "data/eoddata/ibkr/$MARKET/daily.csv" ] && STAMP+=(--override "data/eoddata/ibkr/$MARKET/daily.csv") || echo "IBKR bars: none for $MARKET in the store" >> report0.txt;; esac
          ./build/ofm_research --csv data/stocks.csv --lag 1 --scan --costs "$MARKET" --pricing "$PRICING" --capital "$CAPITAL" "${STAMP[@]}" --json data/r.json > report.txt
          [ -f report0.txt ] && cat report0.txt >> report.txt
          # Token mc: the backtest through Monte Carlo (apps/ofm_mc): luck (probabilistic and deflated Sharpe, about
          # 30 strategies tried), a year resampled in blocks, and fewer fills (IBKR filled 8 of the UK backtest's 18).
          case "+$V+" in *+mc+*) ./build/ofm_mc --days data/tl.csv.days --trades data/tl.csv --trials 30 --slots "${X_NPICK:-10}" --keep 1,0.75,0.5,0.25 >> report.txt ;; esac
          # The next open's orders as the page shows them (share and limit from the last close; no prices).
          jq -r '"next open: " + ((.orders|length)|tostring) + " orders: " + ([.orders[] | "\(.ticker) \((.limit*1000|round)/10)%"] | join(", "))' data/r.json >> report.txt || true
          { echo "### $MARKET $V"; echo '```'; grep -E "a year|  orders:|before costs|next open|candidate trades|calibration|filled|verify|dip network|IBKR bars|^mc:|depth table" report.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
