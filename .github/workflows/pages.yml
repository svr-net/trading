name: Pages

# Publishes the page (web/ and the published scans) to GitHub Pages; the checks ran on the pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      site-only: true

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Every deploy names its scripts by the commit, so browsers fetch them again instead of
      # running a cached older version.
      - name: Version the scripts by the commit
        run: |
          V="${GITHUB_SHA::12}"
          sed -i "s|app.js?v=[^\"]*|app.js?v=$V|" site/index.html
          grep -o 'app.js?v=[^"]*' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
