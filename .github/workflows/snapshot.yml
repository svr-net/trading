# Downloads the 5-minute bars of futures and index series over their whole session into the
# private store svr-net/eod (ofm_eod snapshot), for snapshots at the US open. Prices
# stay in that private repository (EODData's licence); the log shows counts and stamps only.
name: Intraday series
on:
  workflow_dispatch:
    inputs:
      symbols: { description: 'EXCHANGE:CODE, comma separated', default: 'EUREX:FX.C' }
      from: { description: 'First month (YYYY-MM)', default: '2019-01' }
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ofm-tools
      - name: The EOD store (svr-net/eod, libgit2)
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: mkdir -p data && ofm ofm_eod sync --dir data/eoddata
      - name: Download the 5-minute bars
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: ofm ofm_eod snapshot --symbols "${{ inputs.symbols }}" --from "${{ inputs.from }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push the new data to the EOD store (svr-net/eod, libgit2)
        if: ${{ always() }}
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: ofm ofm_eod push --dir data/eoddata --message "Intraday series $(date -u +%Y-%m-%d)" | tee -a "$GITHUB_STEP_SUMMARY"
