# Keeps LSE daily bars from EODData (key in the EODDATA_API_KEY secret) in a persistent store in
# the runner's cache, adding only the days missing (see the store step), reports what it holds
# (dates, symbols, rows) and backtests the model on it; 'refresh' downloads every history again
# (results only). EODData's licence does not allow redistributing the raw data, so the prices
# stay in the cache and are never published.
name: UK portfolio

on:
  # Weekday evenings at 19:00 UTC (20:00 UK summer time, 19:00 winter): download the day, scan,
  # publish the proposals and email the daily report.
  schedule:
    - cron: '0 19 * * 1-5'
  workflow_dispatch:
    inputs:
      universe: { description: 'Most traded shares to download', default: '250' }
      years: { description: 'Years of history (the plan serves about 9)', default: '9' }
      series: { description: 'Futures, index and currency series (EXCHANGE:CODE, comma separated)', default: 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP' }
      probe: { description: 'Only list the exchanges and futures markets the key can see', type: boolean, default: false }
      refresh: { description: 'Download every history again (normally only the missing days are fetched)', type: boolean, default: false }
      email: { description: 'Email the daily report (needs the SMTP secrets)', type: boolean, default: false }
      cost_pct: { description: 'Transaction cost per side, percent (market standard 0.10)', default: '0.10' }
      daytest: { description: 'Also test the daily top 10 against the real bars (research; results in the run summary only)', type: boolean, default: false }
      stamp_pct: { description: 'Stamp duty on purchases, percent (0 for CFDs, spread bets, AIM; 0.50 for UK shares bought directly)', default: '0' }

permissions:
  contents: write   # commit the scan (results only) to main
  actions: write    # start the Pages deployment

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test the model
        run: |
          pip install -r requirements.txt
          python model/test_orthofactor.py
      - name: Exchanges and futures markets available (metadata only)
        if: ${{ inputs.probe }}
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: node tools/eoddata/exchanges.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      # The EODData store (tools/eoddata/store.mjs): every symbol's bars, kept between runs by
      # actions/cache (never committed or published: EODData's licence). Runs on main add only the
      # days each symbol is missing (the latest day from the exchange's quote list, a short request
      # for a longer gap, a full history only for a stock new to the universe) and save the store
      # under a new key; other branches read main's store and make no requests. The weekday
      # schedule keeps the cache in use, so it is never evicted.
      - name: Restore the EODData store
        if: ${{ !inputs.probe }}
        uses: actions/cache@v4
        with:
          path: data/eoddata
          key: eoddata-store-${{ github.run_id }}
          restore-keys: |
            eoddata-store-
            eoddata-
      - name: Update LSE bars (only the days missing from the store)
        if: ${{ !inputs.probe }}
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          ARGS=(--exchange LSE --universe "${{ inputs.universe || '250' }}" --years "${{ inputs.years || '9' }}" --currency GBP --out data/LSE.csv)
          if [ "${{ inputs.refresh }}" = "true" ]; then
            node tools/eoddata/fetch.mjs --refresh "${ARGS[@]}"
          elif [ "${{ github.ref }}" != "refs/heads/main" ] && node tools/eoddata/fetch.mjs --cached "${ARGS[@]}"; then
            echo "Branch run: used main's store, no requests" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node tools/eoddata/fetch.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update futures, index and currency series (only the days missing)
        if: ${{ !inputs.probe }}
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          SYMBOLS="${{ inputs.series || 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP' }}"
          MODE=""
          if [ "${{ inputs.refresh }}" = "true" ]; then MODE="--refresh"; elif [ "${{ github.ref }}" != "refs/heads/main" ]; then MODE="--cached"; fi
          node tools/eoddata/fetch_series.mjs $MODE --years 20 --out data/futures.csv --symbols "$SYMBOLS" | tee -a "$GITHUB_STEP_SUMMARY"
          # A branch with no store yet: download.
          if [ "$(wc -l < data/futures.csv)" -le 1 ]; then
            node tools/eoddata/fetch_series.mjs --years 20 --out data/futures.csv --symbols "$SYMBOLS" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summary (no prices)
        if: ${{ !inputs.probe }}
        run: |
          {
            echo '```'
            echo "rows:    $(($(wc -l < data/LSE.csv) - 1))"
            echo "symbols: $(tail -n +2 data/LSE.csv | cut -d, -f2 | sort -u | wc -l)"
            echo "first:   $(tail -n +2 data/LSE.csv | cut -d, -f1 | sort | head -1)"
            echo "last:    $(tail -n +2 data/LSE.csv | cut -d, -f1 | sort | tail -1)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the C++ model
        if: ${{ !inputs.probe }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S . -B build -G Ninja
          cmake --build build
          ./build/ofm_tests
      - name: Adaptive model, reference engine (results only)
        if: ${{ !inputs.probe }}
        run: |
          mkdir -p report
          ./build/ofm_report --csv data/LSE.csv --series data/futures.csv --cost-pct "${{ inputs.cost_pct || '0.10' }}" --stamp-pct "${{ inputs.stamp_pct || '0' }}" --json report/ofm.json | tee report/ofm.txt
          { echo '```'; cat report/ofm.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Adaptive model, hedged with the stocks' own index (stand-in for FTSE 250 futures)
        if: ${{ !inputs.probe }}
        run: |
          ./build/ofm_report --csv data/LSE.csv --series data/futures.csv --universe-index-hedge --json report/ofm-universe-hedge.json | tee report/ofm-universe-hedge.txt
          { echo '```'; cat report/ofm-universe-hedge.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 'With UK stamp duty (shares bought directly): 0.50% on purchases'
        if: ${{ !inputs.probe }}
        run: |
          ./build/ofm_report --csv data/LSE.csv --series data/futures.csv --cost-pct "${{ inputs.cost_pct || '0.10' }}" --stamp-pct 0.50 --json report/ofm-no-stamp.json > report/ofm-no-stamp.txt
          { echo '```'; grep -A40 'Rolling portfolio' report/ofm-no-stamp.txt | grep -v '^ *[0-9.]* sd\|^        '; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Daily top 10 against the real bars (research, when asked)
        if: ${{ !inputs.probe && inputs.daytest }}
        run: |
          ./build/ofm_daytest --csv data/LSE.csv --series data/futures.csv --cost-pct "${{ inputs.cost_pct || '0.10' }}" --stamp-pct "${{ inputs.stamp_pct || '0' }}" | tee report/daytest.txt
          { echo '```'; cat report/daytest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Adaptive model, emulated GPU kernels (agreement check)
        if: ${{ !inputs.probe }}
        run: ./build/ofm_report --csv data/LSE.csv --series data/futures.csv --engine emulated | head -24
      - name: 'Benchmark - first Python model, fixed look-backs, monthly (results only)'
        if: ${{ !inputs.probe }}
        run: |
          python model/run.py data/LSE.csv | tee report/benchmark.txt
          { echo '```'; cat report/benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.probe }}
        with:
          name: uk-report
          path: report/
          retention-days: 14
      - name: Publish the scan to the page (results only, main branch)
        if: ${{ !inputs.probe && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/data
          cp report/ofm.json web/data/uk.json
          python tools/report/daily_email.py track report/ofm.json web/data/track.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/uk.json web/data/track.json
          if git diff --cached --quiet; then echo "scan unchanged"; exit 0; fi
          git commit -m "UK scan $(date -u +%Y-%m-%d) (results only)"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
      - name: Email the daily report (scheduled runs, or when asked)
        if: ${{ !inputs.probe && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.email) }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python tools/report/daily_email.py send report/ofm.json web/data/track.json
