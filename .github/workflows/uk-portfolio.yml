# Downloads LSE daily bars from EODData (key in the EODDATA_API_KEY secret) into the runner's
# cache and reports only what was downloaded (dates, symbols, rows). EODData's licence does not
# allow redistributing the raw data, so the prices stay in the cache and are never published.
name: UK portfolio

on:
  workflow_dispatch:
    inputs:
      universe: { description: 'Most traded shares to download', default: '120' }
      years: { description: 'Years of history', default: '6' }

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore the EODData cache
        uses: actions/cache@v4
        with:
          path: data/eoddata
          key: eoddata-${{ github.run_id }}
          restore-keys: eoddata-
      - name: Download LSE bars
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: node tools/eoddata/fetch.mjs --exchange LSE --universe "${{ inputs.universe || '120' }}" --years "${{ inputs.years || '6' }}" --currency GBP --out data/LSE.csv
      - name: Summary (no prices)
        run: |
          {
            echo '```'
            echo "rows:    $(($(wc -l < data/LSE.csv) - 1))"
            echo "symbols: $(tail -n +2 data/LSE.csv | cut -d, -f2 | sort -u | wc -l)"
            echo "first:   $(tail -n +2 data/LSE.csv | cut -d, -f1 | sort | head -1)"
            echo "last:    $(tail -n +2 data/LSE.csv | cut -d, -f1 | sort | tail -1)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
