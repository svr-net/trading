# Keeps EODData's daily and 5-minute bars (key in the EODDATA_API_KEY secret) in the private
# repository svr-net/eod, adding only what is missing (see the store steps), reports what it holds
# (dates, symbols, rows) and backtests the model on it; 'refresh' downloads every history again
# (results only). EODData's licence does not allow redistributing the raw data, so the prices
# stay in that private repository and are never published.
name: Daily trades (UK, EU, US and APAC)

on:
  # Weekday evenings: UK at 19:00 UTC (after the London close), US at 22:30 UTC (after the New
  # York close): download the day, scan, publish the proposals and email the daily report.
  # APAC (ASX, SGX) at 10:00 UTC, after the Singapore close; EU at 18:30 UTC, after the European close,
  # and UK and EU again at 21:30 UTC (EODData's European and London days came after the 18:30 and
  # 19:00 scans on 5 Nov, which made the orders from the day before; the later run makes them from
  # the day's close), and once more at 05:30 UTC before the next open (EODData's day may come later
  # still; the bridge places UK and EU at 07:45 UTC, so the morning run's orders are the ones placed).
  schedule:
    - cron: '0 19 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
    inputs:
      market: { description: 'Market', type: choice, options: [all, UK, EU, US, APAC, INDEX, FOREX], default: all }
      years: { description: 'Years of history (the plan serves about 9)', default: '9' }
      series: { description: 'Futures, index and currency series (EXCHANGE:CODE, comma separated)', default: 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP,FOREX:EURAUD' }
      refresh: { description: 'Download every history again (normally only the missing days are fetched)', type: boolean, default: false }
      email: { description: 'Email the daily report (needs the SMTP secrets)', type: boolean, default: false }
      pool: { description: 'At most this many shares per exchange (default: every share the store keeps)', default: '' }
      us_exchanges: { description: 'US exchanges (comma separated)', default: 'NYSE,NASDAQ' }

permissions:
  contents: write   # commit the scan (results only) to main
  actions: write    # start the Pages deployment

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(github.event_name == 'schedule' && (github.event.schedule == '0 19 * * 1-5' && '["UK"]' || github.event.schedule == '0 10 * * 1-5' && '["APAC"]' || github.event.schedule == '30 18 * * 1-5' && '["EU","INDEX"]' || (github.event.schedule == '30 21 * * 1-5' || github.event.schedule == '30 5 * * 1-5') && '["UK","EU","INDEX"]' || '["US","FOREX"]') || (inputs.market == 'UK' && '["UK"]' || inputs.market == 'US' && '["US"]' || inputs.market == 'APAC' && '["APAC"]' || inputs.market == 'EU' && '["EU"]' || inputs.market == 'INDEX' && '["INDEX"]' || inputs.market == 'FOREX' && '["FOREX"]' || '["UK","EU","US","APAC","INDEX","FOREX"]')) }}
    env:
      MARKET: ${{ matrix.market }}
      # EU: Amsterdam and Frankfurt/Xetra only, the venues without a transaction tax (26 Nov, intraday: Paris's FTT and the
      # Belgian, Spanish and Portuguese taxes made every order a loss after costs; AMS+FRA: Sharpe 1.66 against 1.26, the
      # round trip 0.12% against 0.86%). EU without Oslo (no trading permission at IBKR). Amsterdam back (5 Nov, the live setting with IBKR's
      # fills and costs, 8-year walk-forward): 8.4% a year, Sharpe 1.38 -> 18.2%, Sharpe 1.71.
      # INDEX: UCITS index ETFs on Xetra (tools/eoddata/index.txt; with Europe's scans); FOREX: currency pairs (forex.txt; research only).
      EXCHANGES: ${{ matrix.market == 'US' && (inputs.us_exchanges || 'NYSE,NASDAQ') || matrix.market == 'APAC' && 'ASX,SGX' || matrix.market == 'EU' && 'AMS,FRA' || matrix.market == 'INDEX' && 'FRA' || matrix.market == 'FOREX' && 'FOREX' || 'LSE' }}
    steps:
      - uses: actions/checkout@v4
      # The native tools (docker/native/Dockerfile, Alpine): the strategy engine, the loaders and the scan, in C++.
      # The image is made only when every strategy's checks pass (no look-ahead, every back end the same, the final
      # orders by expected return with their costs) and the scan's own; nothing is published otherwise.
      - uses: ./.github/actions/ofm-tools
      # The EODData store: every symbol's daily bars and 5-minute months, kept in the private repository
      # svr-net/eod (never published: EODData's licence), at data/eoddata, read and written through libgit2
      # (ofm_eod sync and push). A run adds only what is missing and pushes it back (the push step), so each
      # bar is downloaded once, for every run. EOD_TOKEN: a token with read and write access to svr-net/eod.
      # The store itself is cached on the runner (GitHub's cache), encrypted with EOD_TOKEN: the repository
      # is public and a pull request from a fork may restore the main branch's caches, but gets no secrets,
      # so EODData's prices stay unreadable to it. A run restores the last one and fetches only main's
      # newest commit; a fresh clone when there is none (or it cannot be read). The token is never stored
      # in the clone (libgit2 asks for it at each fetch and push).
      # One copy a day for every market (the whole store either way): six markets saving their own after every run
      # (1-2.7 GB each) overflowed the repository's 10 GB of cache, and runs found none (16 Nov).
      - name: The day (the cache's key)
        id: day
        run: echo "d=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: The EOD store from the runner's cache (encrypted)
        id: store
        uses: actions/cache/restore@v4
        with:
          path: data/eodstore.enc
          key: eodstore-${{ steps.day.outputs.d }}
          restore-keys: |
            eodstore-
      - name: The cached store opened
        if: steps.store.outputs.cache-matched-key != ''
        continue-on-error: true
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: |
          set -o pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:EOD_TOKEN -in data/eodstore.enc | zstd -dcq | tar -x -C data || rm -rf data/eoddata
          rm -f data/eodstore.enc
      - name: Bring the store up to date (svr-net/eod, libgit2)
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p data
          ofm ofm_eod sync --dir data/eoddata | tee -a "$GITHUB_STEP_SUMMARY" || { rm -rf data/eoddata; ofm ofm_eod sync --dir data/eoddata | tee -a "$GITHUB_STEP_SUMMARY"; }
      - name: Update the share bars (only the days missing from the store)
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          REFRESH=(); if [ "${{ inputs.refresh }}" = "true" ]; then REFRESH=(--refresh); fi
          echo 'date,ticker,open,high,low,close,volume' > data/stocks.csv
          # INDEX and FOREX: named series (each from the first of its EODData exchanges with bars; FOREX's
          # pairs each with its inverse, so the model can take either side), not an exchange's shares.
          case "$MARKET" in
            INDEX) ofm ofm_eod market --list tools/eoddata/index.txt --out data/stocks.csv --years "${{ inputs.years || '9' }}" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0;;
            FOREX) ofm ofm_eod market --list tools/eoddata/forex.txt --out data/stocks.csv --years "${{ inputs.years || '9' }}" --inverse | tee -a "$GITHUB_STEP_SUMMARY"; exit 0;;
          esac
          for EX in $(echo "$EXCHANGES" | tr ',' ' '); do
            case "$EX" in LSE) CUR=GBP;; ASX) CUR=AUD;; SGX) CUR=SGD;; OSL) CUR=NOK;; PAR|AMS|BRU|LIS|MSE|FRA) CUR=EUR;; *) CUR="";; esac
            # Every share the store keeps (--pool store), not only today's most traded: the strategy engine picks each
            # day's most traded as of that day, so the share lists are not chosen with hindsight (16 Nov).
            ofm ofm_eod shares --exchange "$EX" --pool store --universe "${{ inputs.pool || '100000' }}" --years "${{ inputs.years || '9' }}" --currency "$CUR" --out "data/$EX.csv" "${REFRESH[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            # Markets of several exchanges: tickers as EXCHANGE:CODE (each exchange's costs, IBKR's venue).
            case "$MARKET" in EU|APAC) tail -n +2 "data/$EX.csv" | awk -F, -v OFS=, -v ex="$EX" '{$2=ex":"$2; print}' >> data/stocks.csv;; *) tail -n +2 "data/$EX.csv" >> data/stocks.csv;; esac
          done
      # The market's share bars as the strategies read them, kept in the store (svr-net/eod, never published) by
      # month: markets/<MARKET>/<yyyy-mm>.csv, so that a backtest elsewhere reads them as they are instead of building
      # them again. Only the months that changed are pushed (the current one; all after a split read from the prices).
      - name: Keep the market's share bars in the store (markets/<MARKET>/, by month)
        continue-on-error: true
        run: |
          set -o pipefail
          case "$MARKET" in INDEX|FOREX) exit 0;; esac
          D="data/eoddata/markets/$MARKET"
          rm -rf "$D" && mkdir -p "$D"
          tail -n +2 data/stocks.csv | sort -t, -k1,1 -s | awk -F, -v d="$D" '
            { m = substr($1, 1, 7); if (m != cur) { if (f) close(f); cur = m; f = d "/" m ".csv"; print "date,ticker,open,high,low,close,volume" > f } print > f }'
          echo "share bars kept in the store: $(ls "$D" | wc -l) months in markets/$MARKET ($(du -sh "$D" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"
      # EODData serves only today's fundamentals: each day's, for the model's shares, are kept in the
      # store (fundamentals/<EXCHANGE>/<date>.csv.gz) so that a history builds up; with the latest
      # profiles (sectors, industries). A failure here does not stop the scan.
      - name: Keep the day's fundamentals and the profiles (svr-net/eod; in the background)
        continue-on-error: true
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        # In the background (the model does not read them): the push step waits for it.
        # Not for INDEX or FOREX (ETFs and currency pairs: no company fundamentals).
        run: case "$MARKET" in INDEX|FOREX) exit 0;; esac; nohup sh -c 'ofm ofm_eod profiles --exchanges "$EXCHANGES" --universe data/stocks.csv --out data/eoddata/profiles --fundamentals data/eoddata/fundamentals; echo $? > profiles.rc' > profiles.log 2>&1 &
      - name: Update futures, index and currency series (only the days missing)
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          SYMBOLS="${{ inputs.series || 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP,FOREX:EURAUD' }}"
          MODE=(); if [ "${{ inputs.refresh }}" = "true" ]; then MODE=(--refresh); fi
          ofm ofm_eod series "${MODE[@]}" --years 20 --out data/futures.csv --symbols "$SYMBOLS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary (no prices)
        run: |
          {
            echo '```'
            echo "rows:    $(($(wc -l < data/stocks.csv) - 1))"
            echo "symbols: $(tail -n +2 data/stocks.csv | cut -d, -f2 | sort -u | wc -l)"
            echo "first:   $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort | head -1)"
            echo "last:    $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort | tail -1)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The strategy engine (apps/ofm_strategy): each market's injectable strategy (strategies/*.cpp, chosen in
      # config/markets.json) on the fused kernels of the chosen back end; learnt and backtested before any cost,
      # the broker's costs applied to the final order list only (by expected return; an order negative after
      # costs dropped). The scan (apps/ofm_scan) runs it for the budget and splits the account's money. Results only.
      - name: The model and the daily trades (results only)
        run: |
          set -o pipefail
          mkdir -p report
          PUBLISH=(); if [ "${{ github.ref }}" = "refs/heads/main" ]; then PUBLISH=(--publish-orders); fi
          # UK: AIM shares pay no stamp duty (the list refreshed from a public listing of the AIM market; the committed one if that fails).
          STAMP=(); if [ "$MARKET" = UK ]; then ofm ofm_eod aim tools/eoddata/aim.txt --cache data/eoddata/lists/aim.txt || true; STAMP=(--stamp-free tools/eoddata/aim.txt); fi
          # EU, APAC and INDEX (Xetra): each exchange's costs, taxes and amount a trade (tools/venues.txt: EUR 5,000 in Europe, AUD/SGD 5,000 in Asia-Pacific).
          case "$MARKET" in EU|APAC|INDEX) STAMP=(--venues tools/venues.txt);; esac
          # IBKR's own daily bars (the bridge fetches them into the store on Saturdays: two years, their open
          # the opening auction's price) in place of the store's where it has them: EODData's open for a thin
          # share is not the auction's (4 Nov HCM: the store's open 2.4% under the limit, IBKR filled at the
          # limit), so the model learns and backtests on prices that traded.
          IB="data/eoddata/ibkr/$MARKET/daily.csv"
          if [ -s "$IB" ] && [ "$(wc -l < "$IB")" -gt 1 ]; then STAMP+=(--override "$IB"); echo "IBKR bars: $(($(wc -l < "$IB") - 1)) rows in place of the store's"; else echo "IBKR bars: none for $MARKET in the store; the store's bars are used"; fi
          # The amount a trade (IBKR's fixed pricing, the account's): GBP 5,000 in the UK (GBP 3 an order up
          # to GBP 6,000), USD 5,000 in the US, EUR 5,000 in Europe, 5,000 in Asia-Pacific (AUD, SGD; the
          # exchanges' amounts are in tools/venues.txt).
          CAPITAL=5000
          # The market's strategy (config/markets.json), run by the strategy engine: its orders are the ones the bridge places.
          ofm ofm_scan run --market "$MARKET" "${PUBLISH[@]}" -- --csv data/stocks.csv --costs "$MARKET" --pricing fixed --capital "$CAPITAL" "${STAMP[@]}" > report/strategies.log || { cat report/strategies.log; exit 1; }
          grep -E "^strategies|^budget|^strategy:" report/strategies.log || true  # the strategy's headline in the log
          { echo '```'; cat report/ofm.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The day's fundamentals (started above)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ ! -f profiles.log ]; then exit 0; fi
          for i in $(seq 1 900); do if [ -f profiles.rc ]; then break; fi; sleep 1; done
          tee -a "$GITHUB_STEP_SUMMARY" < profiles.log
          exit "$(cat profiles.rc 2>/dev/null || echo 1)"
      # What this run downloaded goes back to svr-net/eod (libgit2: one commit, never forced). Another market's
      # job may push first: this run's changes are made again on top of its commit (a file both updated, the
      # shared series, keeps this run's version, which holds the same days or more).
      - name: Push the new data to the EOD store (svr-net/eod, libgit2)
        if: ${{ always() }}
        # A failure here (e.g. an expired EOD_TOKEN) is reported but does not stop the page's scan.
        continue-on-error: true
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: ofm ofm_eod push --dir data/eoddata --message "$MARKET data $(date -u +%Y-%m-%d)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The store for the next run's cache, encrypted (the clone holds no credentials).
      - name: Encrypt the EOD store for the runner's cache
        id: sealed
        if: ${{ always() && steps.store.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: |
          set -o pipefail
          test -d data/eoddata/.git
          tar -C data -cf - eoddata | zstd -T0 -3 -q | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:EOD_TOKEN -out data/eodstore.enc
          echo "EOD store: $(du -h data/eodstore.enc | cut -f1) encrypted for the cache"
      - name: Cache the EOD store for the next run
        if: ${{ always() && steps.sealed.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/eodstore.enc
          key: eodstore-${{ steps.day.outputs.d }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.market }}-report
          path: report/
          retention-days: 14
      - name: Publish the scan to the page (results only, main branch)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/data
          M=$(echo "$MARKET" | tr 'A-Z' 'a-z')
          TRACK=web/data/track.json; [ "$M" = "uk" ] || TRACK="web/data/track-$M.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The other market's job may push first: start again from main's newest commit and retry.
          for k in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            jq -c --arg ex "$EXCHANGES" '.exchanges = ($ex | split(","))' report/ofm.json > "web/data/$M.json"  # the page names the exchanges scanned
            ofm ofm_scan track report/ofm.json "$TRACK"
            ofm ofm_scan index report/strategies.json web/data/strategies.json  # the market's entry in the strategies' index
            # The market's share of the account's daily limit and its record (results only), read by the other markets' scans.
            if [ -f report/budget.json ]; then cp report/budget.json "web/data/budget-$M.json"; git add "web/data/budget-$M.json"; fi
            git add "web/data/$M.json" "$TRACK" web/data/strategies.json
            if git diff --cached --quiet; then echo "scan unchanged"; exit 0; fi
            git commit -q -m "$MARKET scan $(date -u +%Y-%m-%d) (results only)"
            git push -q origin HEAD:main && break
            sleep $((k * 5))
          done
          gh workflow run pages.yml --ref main
      - name: Email the daily report (scheduled runs, or when asked)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.email) }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          M=$(echo "$MARKET" | tr 'A-Z' 'a-z')
          TRACK=web/data/track.json; [ "$M" = "uk" ] || TRACK="web/data/track-$M.json"
          ofm ofm_scan mail report/ofm.json "$TRACK"
