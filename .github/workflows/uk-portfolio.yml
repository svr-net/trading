# Keeps EODData's daily and 5-minute bars (key in the EODDATA_API_KEY secret) in the private
# repository svr-net/eod, adding only what is missing (see the store steps), reports what it holds
# (dates, symbols, rows) and backtests the model on it; 'refresh' downloads every history again
# (results only). EODData's licence does not allow redistributing the raw data, so the prices
# stay in that private repository and are never published.
name: Daily trades (UK, EU, US and APAC)

on:
  # Weekday evenings: UK at 19:00 UTC (after the London close), US at 22:30 UTC (after the New
  # York close): download the day, scan, publish the proposals and email the daily report.
  # APAC (ASX, SGX) at 10:00 UTC, after the Singapore close; EU at 18:30 UTC, after the European close,
  # and UK and EU again at 21:30 UTC (EODData's European and London days came after the 18:30 and
  # 19:00 scans on 5 Nov, which made the orders from the day before; the later run makes them from
  # the day's close), and once more at 05:30 UTC before the next open (EODData's day may come later
  # still; the bridge places UK and EU at 07:45 UTC, so the morning run's orders are the ones placed).
  schedule:
    - cron: '0 19 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
    inputs:
      market: { description: 'Market', type: choice, options: [all, UK, EU, US, APAC], default: all }
      years: { description: 'Years of history (the plan serves about 9)', default: '9' }
      series: { description: 'Futures, index and currency series (EXCHANGE:CODE, comma separated)', default: 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP,FOREX:EURAUD' }
      refresh: { description: 'Download every history again (normally only the missing days are fetched)', type: boolean, default: false }
      email: { description: 'Email the daily report (needs the SMTP secrets)', type: boolean, default: false }
      pool: { description: 'The most traded shares kept per exchange (default: 500 UK, 2000 US, 300 each EU exchange, 500 ASX and SGX)', default: '' }
      us_exchanges: { description: 'US exchanges (comma separated)', default: 'NYSE,NASDAQ' }

permissions:
  contents: write   # commit the scan (results only) to main
  actions: write    # start the Pages deployment

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(github.event_name == 'schedule' && (github.event.schedule == '0 19 * * 1-5' && '["UK"]' || github.event.schedule == '0 10 * * 1-5' && '["APAC"]' || github.event.schedule == '30 18 * * 1-5' && '["EU"]' || (github.event.schedule == '30 21 * * 1-5' || github.event.schedule == '30 5 * * 1-5') && '["UK","EU"]' || '["US"]') || (inputs.market == 'UK' && '["UK"]' || inputs.market == 'US' && '["US"]' || inputs.market == 'APAC' && '["APAC"]' || inputs.market == 'EU' && '["EU"]' || '["UK","EU","US","APAC"]')) }}
    env:
      MARKET: ${{ matrix.market }}
      # EU without Oslo (no trading permission at IBKR). Amsterdam back (5 Nov, the live setting with IBKR's
      # fills and costs, 8-year walk-forward): 8.4% a year, Sharpe 1.38 -> 18.2%, Sharpe 1.71.
      EXCHANGES: ${{ matrix.market == 'US' && (inputs.us_exchanges || 'NYSE,NASDAQ') || matrix.market == 'APAC' && 'ASX,SGX' || matrix.market == 'EU' && 'PAR,AMS,BRU,LIS,MSE,FRA' || 'LSE' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The model's build, tests and no-look-ahead checks (generated data only) run in the background while
      # the data downloads; the model step waits for them, and nothing is published if they fail.
      - name: Build the model and run its checks (in the background)
        run: |
          nohup sh -c 'sudo apt-get install -y --no-install-recommends ninja-build >/dev/null && cmake -S . -B build -G Ninja && cmake --build build --target ofm_research ofm_single ofm_hold ofm_tests && ./build/ofm_tests && sh tools/check/leak.sh build/ofm_research; echo $? > build.rc' > build.log 2>&1 &
      # The EODData store (tools/eoddata/store.mjs and intraday.mjs): every symbol's daily bars and
      # 5-minute months, kept in the private repository svr-net/eod (never published: EODData's
      # licence), checked out at data/eoddata by every run on every branch. A run adds only what is
      # missing and pushes it back (the last step), so each bar is downloaded once, for every run.
      # EOD_TOKEN: a token with read and write access to svr-net/eod's contents.
      # The store itself is cached on the runner (GitHub's cache), encrypted with EOD_TOKEN: the
      # repository is public and a pull request from a fork may restore the main branch's caches, but
      # gets no secrets, so EODData's prices stay unreadable to it. A run restores the last one and
      # fetches only the commits since; a full checkout only when there is none (or it cannot be read).
      # The cache is saved at the job's end, without the credentials this run's git used.
      - name: The EOD store from the runner's cache (encrypted)
        id: store
        uses: actions/cache/restore@v4
        with:
          path: data/eodstore.enc
          key: eodstore-${{ matrix.market }}-${{ github.run_id }}
          restore-keys: |
            eodstore-${{ matrix.market }}-
      - name: Bring the cached store up to date (svr-net/eod)
        id: fetched
        if: steps.store.outputs.cache-matched-key != ''
        continue-on-error: true
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: |
          set -o pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:EOD_TOKEN -in data/eodstore.enc | zstd -dcq | tar -x -C data
          rm -f data/eodstore.enc
          cd data/eoddata
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$EOD_TOKEN" | base64 -w0)"
          git fetch -q --depth 1 origin main
          git reset -q --hard FETCH_HEAD
          git clean -fdq
          echo "EOD store: from the cache, brought up to $(git log -1 --format=%cs) ($(git rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: No cached store to use
        if: steps.store.outputs.cache-matched-key == '' || steps.fetched.outcome != 'success'
        run: rm -rf data/eoddata data/eodstore.enc
      - name: Check out the EOD store (svr-net/eod)
        if: steps.store.outputs.cache-matched-key == '' || steps.fetched.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: svr-net/eod
          token: ${{ secrets.EOD_TOKEN }}
          path: data/eoddata
          fetch-depth: 1
      - name: Update the share bars (only the days missing from the store)
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p data
          echo 'date,ticker,open,high,low,close,volume' > data/stocks.csv
          for EX in $(echo "$EXCHANGES" | tr ',' ' '); do
            case "$EX" in LSE) CUR=GBP;; ASX) CUR=AUD;; SGX) CUR=SGD;; OSL) CUR=NOK;; PAR|AMS|BRU|LIS|MSE|FRA) CUR=EUR;; *) CUR="";; esac
            ARGS=(--exchange "$EX" --universe "${{ inputs.pool || (matrix.market == 'US' && '2000' || matrix.market == 'EU' && '300' || '500') }}" --years "${{ inputs.years || '9' }}" --currency "$CUR" --out "data/$EX.csv")
            if [ "${{ inputs.refresh }}" = "true" ]; then
              node tools/eoddata/fetch.mjs --refresh "${ARGS[@]}"
            else
              node tools/eoddata/fetch.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            # Markets of several exchanges: tickers as EXCHANGE:CODE (each exchange's costs, IBKR's venue).
            case "$MARKET" in EU|APAC) tail -n +2 "data/$EX.csv" | awk -F, -v OFS=, -v ex="$EX" '{$2=ex":"$2; print}' >> data/stocks.csv;; *) tail -n +2 "data/$EX.csv" >> data/stocks.csv;; esac
          done
      # EODData serves only today's fundamentals: each day's, for the model's shares, are kept in the
      # store (fundamentals/<EXCHANGE>/<date>.csv.gz) so that a history builds up; with the latest
      # profiles (sectors, industries). A failure here does not stop the scan.
      - name: Keep the day's fundamentals and the profiles (svr-net/eod; in the background)
        continue-on-error: true
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        # In the background (the model does not read them): the push step waits for it.
        run: nohup sh -c 'node tools/eoddata/profiles.mjs --exchanges "$EXCHANGES" --universe data/stocks.csv --out data/eoddata/profiles --fundamentals data/eoddata/fundamentals; echo $? > profiles.rc' > profiles.log 2>&1 &
      - name: Update futures, index and currency series (only the days missing)
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          SYMBOLS="${{ inputs.series || 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP,FOREX:EURAUD' }}"
          MODE=""
          if [ "${{ inputs.refresh }}" = "true" ]; then MODE="--refresh"; fi
          node tools/eoddata/fetch_series.mjs $MODE --years 20 --out data/futures.csv --symbols "$SYMBOLS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary (no prices)
        run: |
          {
            echo '```'
            echo "rows:    $(($(wc -l < data/stocks.csv) - 1))"
            echo "symbols: $(tail -n +2 data/stocks.csv | cut -d, -f2 | sort -u | wc -l)"
            echo "first:   $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort | head -1)"
            echo "last:    $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort | tail -1)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The predictive model (apps/ofm_research, fused kernels in kernels/v2): every share's
      # features from its daily OHLCV, a walk-forward linear model with liquidity and volatility
      # interactions, traded on the prediction one close older (so bid-ask bounce between the
      # last close and the next open is not learnt); the next open's 10 highest, bought at the open
      # and sold at the close. Results only.
      # Before anything is published: the model's tests and its no-look-ahead checks (a generated
      # market: later data changed, a day's bars removed, the kernel against the trade path).
      - name: Tests and no-look-ahead checks (the build started above)
        run: |
          for i in $(seq 1 600); do if [ -f build.rc ]; then break; fi; sleep 2; done
          cat build.log
          exit "$(cat build.rc 2>/dev/null || echo 1)"
      - name: The model and the daily trades (results only)
        run: |
          set -o pipefail
          mkdir -p report
          PUBLISH=(); if [ "${{ github.ref }}" = "refs/heads/main" ]; then PUBLISH=(--publish-orders); fi
          # UK: AIM shares pay no stamp duty (the list refreshed from a public listing of the AIM market; the committed one if that fails).
          STAMP=(); if [ "$MARKET" = UK ]; then node tools/eoddata/aim.mjs tools/eoddata/aim.txt || true; STAMP=(--stamp-free tools/eoddata/aim.txt); fi
          # UK: which shares trade through the opening and closing auctions (the exchange's monthly
          # instrument list; the committed one if that fails): the others pay a half-spread each way.
          if [ "$MARKET" = UK ]; then node tools/eoddata/lse_segments.mjs tools/eoddata/lse_segments.csv || true; STAMP+=(--segments tools/eoddata/lse_segments.csv); fi
          # EU and APAC: each exchange's costs, taxes and amount a trade (tools/venues.txt: EUR 5,000 in Europe, AUD/SGD 5,000 in Asia-Pacific).
          case "$MARKET" in EU|APAC) STAMP=(--venues tools/venues.txt);; esac
          # Every market: a safety stop only (a learnt rare day's fall, 1 in 20 to 1 in 100; no take-profit;
          # else sold at the close): shares stopped in the opening volatility mostly recover by the close
          # (UK, same data: +79% a year, Sharpe 4.98, against +55%, 4.94, with learnt stops and take-profits).
          STAMP+=(--exit safety)
          # IBKR's own daily bars (the bridge fetches them into the store on Saturdays: two years, their open
          # the opening auction's price) in place of the store's where it has them: EODData's open for a thin
          # share is not the auction's (4 Nov HCM: the store's open 2.4% under the limit, IBKR filled at the
          # limit), so the model learns and backtests on prices that traded. Every strategy gets them.
          IB="data/eoddata/ibkr/$MARKET/daily.csv"
          if [ -s "$IB" ] && [ "$(wc -l < "$IB")" -gt 1 ]; then STAMP+=(--override "$IB"); echo "IBKR bars: $(($(wc -l < "$IB") - 1)) rows in place of the store's"; else echo "IBKR bars: none for $MARKET in the store; the store's bars are used"; fi
          # The amount a trade (IBKR's fixed pricing, the account's): GBP 5,000 in the UK (GBP 3 an order up
          # to GBP 6,000), USD 5,000 in the US, EUR 5,000 in Europe, 5,000 in Asia-Pacific (AUD, SGD; the
          # exchanges' amounts are in tools/venues.txt).
          CAPITAL=5000
          # The market's strategies (config/markets.json): the live one makes the orders the bridge places;
          # each shadow runs on the same data, its orders kept in the store and never placed, its results
          # beside the live one's on the page. Every run checks the kernel's trades against the trade
          # path that makes the orders (X_VERIFY); any difference stops the live run before anything is published.
          python3 tools/scan/strategies.py --market "$MARKET" "${PUBLISH[@]}" -- --csv data/stocks.csv --lag 1 --scan --costs "$MARKET" --pricing fixed --capital "$CAPITAL" "${STAMP[@]}" > report/strategies.log || { cat report/strategies.log; exit 1; }
          grep -E "^strategies|^budget|self-adaptive pool|  orders:|before costs|^single: the account|^single: next|^hold: the account|^hold: next" report/strategies.log || true  # each strategy's headline in the log
          for f in report/shadow-*.txt; do
            if [ -f "$f" ]; then { echo "### shadow ${f#report/shadow-}"; echo '```'; grep -E "self-adaptive|  orders:|before costs|^single: the account|^single: next|^hold: the account|^hold: next" "$f" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          done
          { echo '```'; cat report/ofm.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The day's fundamentals (started above)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ ! -f profiles.log ]; then exit 0; fi
          for i in $(seq 1 900); do if [ -f profiles.rc ]; then break; fi; sleep 1; done
          tee -a "$GITHUB_STEP_SUMMARY" < profiles.log
          exit "$(cat profiles.rc 2>/dev/null || echo 1)"
      # What this run downloaded goes back to svr-net/eod. The other market's job may push first:
      # rebase and retry; a file both jobs updated (the shared series) keeps the version already
      # pushed, which holds the same days.
      - name: Push the new data to the EOD store (svr-net/eod)
        if: ${{ always() }}
        # A failure here (e.g. an expired EOD_TOKEN) is reported but does not stop the page's scan.
        continue-on-error: true
        run: |
          cd data/eoddata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "EOD store: nothing new"; exit 0; fi
          git commit -q -m "$MARKET data $(date -u +%Y-%m-%d)"
          for k in 1 2 3 4 5; do
            git pull -q --rebase -X ours origin main && git push -q origin HEAD:main && { echo "EOD store: pushed"; exit 0; }
            git rebase --abort 2>/dev/null || true
            sleep $((k * 5))
          done
          exit 1
      # The store for the next run's cache: without the credentials this run's git used, encrypted.
      - name: Encrypt the EOD store for the runner's cache
        id: sealed
        if: ${{ always() }}
        continue-on-error: true
        env:
          EOD_TOKEN: ${{ secrets.EOD_TOKEN }}
        run: |
          set -o pipefail
          test -d data/eoddata/.git
          git -C data/eoddata config --unset-all http.https://github.com/.extraheader || true
          tar -C data -cf - eoddata | zstd -T0 -3 -q | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:EOD_TOKEN -out data/eodstore.enc
          echo "EOD store: $(du -h data/eodstore.enc | cut -f1) encrypted for the cache"
      - name: Cache the EOD store for the next run
        if: ${{ always() && steps.sealed.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/eodstore.enc
          key: eodstore-${{ matrix.market }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.market }}-report
          path: report/
          retention-days: 14
      - name: Publish the scan to the page (results only, main branch)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/data
          M=$(echo "$MARKET" | tr 'A-Z' 'a-z')
          TRACK=web/data/track.json; [ "$M" = "uk" ] || TRACK="web/data/track-$M.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The other market's job may push first: rebase and retry.
          for k in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            jq -c --arg ex "$EXCHANGES" '.exchanges = ($ex | split(","))' report/ofm.json > "web/data/$M.json"  # the page names the exchanges scanned
            python3 tools/report/daily_email.py track report/ofm.json "$TRACK"
            # The shadows (results only, as the live one's) and the market's entry in the strategies' index.
            for f in report/shadow-*.json; do
              [ -f "$f" ] || continue
              n=${f#report/shadow-}; n=${n%.json}
              jq -c --arg ex "$EXCHANGES" '.exchanges = ($ex | split(","))' "$f" > "web/data/$M-$n.json"
              python3 tools/report/daily_email.py track "$f" "web/data/track-$M-$n.json"
              git add "web/data/$M-$n.json" "web/data/track-$M-$n.json"
            done
            python3 -c "import json,sys; p='web/data/strategies.json'; d=json.load(open(p)) if __import__('os').path.exists(p) else {'about':'Each market\'s strategies: the live one and its shadows (config/markets.json); results only.','markets':{}}; s=json.load(open('report/strategies.json')); d['markets'][s['market'].lower()]=[{'name':x['name'],'role':x['role'],'env':x['env'],'ref':x['ref']} for x in s['strategies']]; json.dump(d,open(p,'w'),indent=1)"
            # The market's share of the account's daily limit and its record (results only), read by the other markets' scans.
            if [ -f report/budget.json ]; then cp report/budget.json "web/data/budget-$M.json"; git add "web/data/budget-$M.json"; fi
            git add "web/data/$M.json" "$TRACK" web/data/strategies.json
            if git diff --cached --quiet; then echo "scan unchanged"; exit 0; fi
            git commit -q -m "$MARKET scan $(date -u +%Y-%m-%d) (results only)"
            git push -q origin HEAD:main && break
            sleep $((k * 5))
          done
          gh workflow run pages.yml --ref main
      - name: Email the daily report (scheduled runs, or when asked)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.email) }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          M=$(echo "$MARKET" | tr 'A-Z' 'a-z')
          TRACK=web/data/track.json; [ "$M" = "uk" ] || TRACK="web/data/track-$M.json"
          python3 tools/report/daily_email.py send report/ofm.json "$TRACK"
