# Keeps EODData's daily and 5-minute bars (key in the EODDATA_API_KEY secret) in the private
# repository svr-net/eod, adding only what is missing (see the store steps), reports what it holds
# (dates, symbols, rows) and backtests the model on it; 'refresh' downloads every history again
# (results only). EODData's licence does not allow redistributing the raw data, so the prices
# stay in that private repository and are never published.
name: Daily trades (UK and US)

on:
  # Weekday evenings: UK at 19:00 UTC (after the London close), US at 22:30 UTC (after the New
  # York close): download the day, scan, publish the proposals and email the daily report.
  schedule:
    - cron: '0 19 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      market: { description: 'Market', type: choice, options: [both, UK, US], default: both }
      years: { description: 'Years of history (the plan serves about 9)', default: '9' }
      series: { description: 'Futures, index and currency series (EXCHANGE:CODE, comma separated)', default: 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP' }
      refresh: { description: 'Download every history again (normally only the missing days are fetched)', type: boolean, default: false }
      email: { description: 'Email the daily report (needs the SMTP secrets)', type: boolean, default: false }
      pool: { description: 'The most traded shares kept per exchange (default: 500 UK, 2000 US)', default: '' }
      us_exchanges: { description: 'US exchanges (comma separated)', default: 'NYSE,NASDAQ' }

permissions:
  contents: write   # commit the scan (results only) to main
  actions: write    # start the Pages deployment

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(github.event_name == 'schedule' && (github.event.schedule == '0 19 * * 1-5' && '["UK"]' || '["US"]') || (inputs.market == 'UK' && '["UK"]' || inputs.market == 'US' && '["US"]' || '["UK","US"]')) }}
    env:
      MARKET: ${{ matrix.market }}
      EXCHANGES: ${{ matrix.market == 'US' && (inputs.us_exchanges || 'NYSE,NASDAQ') || 'LSE' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The EODData store (tools/eoddata/store.mjs and intraday.mjs): every symbol's daily bars and
      # 5-minute months, kept in the private repository svr-net/eod (never published: EODData's
      # licence), checked out at data/eoddata by every run on every branch. A run adds only what is
      # missing and pushes it back (the last step), so each bar is downloaded once, for every run.
      # EOD_TOKEN: a token with read and write access to svr-net/eod's contents.
      # Until svr-net/eod holds every market: the store the runner's cache held, set aside, adds
      # the files svr-net/eod lacks (it never replaces one).
      - name: Seed from the runner's cache (until svr-net/eod holds this market)
        uses: actions/cache/restore@v4
        with:
          path: data/eoddata
          key: eoddata-${{ matrix.market }}-main-${{ github.run_id }}
          restore-keys: |
            eoddata-${{ matrix.market }}-main-
      - name: Set the cache's store aside
        run: if [ -d data/eoddata ]; then mv data/eoddata data/seed; fi
      - name: Check out the EOD store (svr-net/eod)
        uses: actions/checkout@v4
        with:
          repository: svr-net/eod
          token: ${{ secrets.EOD_TOKEN }}
          path: data/eoddata
          fetch-depth: 1
      - name: Add the files svr-net/eod lacks from the cache's store
        run: |
          if [ -d data/seed ]; then
            before=$(find data/eoddata -type f -not -path '*/.git/*' | wc -l)
            cp -rn data/seed/. data/eoddata/
            echo "seed: $(( $(find data/eoddata -type f -not -path '*/.git/*' | wc -l) - before )) files added from the cache" | tee -a "$GITHUB_STEP_SUMMARY"
            rm -rf data/seed
          fi
      - name: Update the share bars (only the days missing from the store)
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p data
          echo 'date,ticker,open,high,low,close,volume' > data/stocks.csv
          for EX in $(echo "$EXCHANGES" | tr ',' ' '); do
            CUR=""; [ "$EX" = "LSE" ] && CUR="GBP"
            ARGS=(--exchange "$EX" --universe "${{ inputs.pool || (matrix.market == 'US' && '2000' || '500') }}" --years "${{ inputs.years || '9' }}" --currency "$CUR" --out "data/$EX.csv")
            if [ "${{ inputs.refresh }}" = "true" ]; then
              node tools/eoddata/fetch.mjs --refresh "${ARGS[@]}"
            else
              node tools/eoddata/fetch.mjs "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            tail -n +2 "data/$EX.csv" >> data/stocks.csv
          done
      - name: Update futures, index and currency series (only the days missing)
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: |
          set -o pipefail
          SYMBOLS="${{ inputs.series || 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP' }}"
          MODE=""
          if [ "${{ inputs.refresh }}" = "true" ]; then MODE="--refresh"; fi
          node tools/eoddata/fetch_series.mjs $MODE --years 20 --out data/futures.csv --symbols "$SYMBOLS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary (no prices)
        run: |
          {
            echo '```'
            echo "rows:    $(($(wc -l < data/stocks.csv) - 1))"
            echo "symbols: $(tail -n +2 data/stocks.csv | cut -d, -f2 | sort -u | wc -l)"
            echo "first:   $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort | head -1)"
            echo "last:    $(tail -n +2 data/stocks.csv | cut -d, -f1 | sort | tail -1)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the model
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build >/dev/null
          cmake -S . -B build -G Ninja
          cmake --build build --target ofm_research
      # The predictive model (apps/ofm_research, fused kernels in kernels/v2): every share's
      # features from its daily OHLCV, a walk-forward linear model with liquidity and volatility
      # interactions, traded on the prediction one close older (so bid-ask bounce between the
      # last close and the next open is not learnt); the next open's 10 highest, bought at the open
      # and sold at the close. Results only.
      - name: The model and the daily trades (results only)
        run: |
          set -o pipefail
          mkdir -p report
          ORDERS=(); if [ "${{ github.ref }}" = "refs/heads/main" ]; then mkdir -p data/eoddata/orders; ORDERS=(--orders "data/eoddata/orders/$MARKET.json"); fi
          # UK: AIM shares pay no stamp duty (the list refreshed from a public listing of the AIM market; the committed one if that fails).
          STAMP=(); if [ "$MARKET" = UK ]; then node tools/eoddata/aim.mjs tools/eoddata/aim.txt || true; STAMP=(--stamp-free tools/eoddata/aim.txt); fi
          ./build/ofm_research --csv data/stocks.csv --lag 1 --scan --costs "$MARKET" --capital 5000 "${STAMP[@]}" "${ORDERS[@]}" --json report/ofm.json | tee report/ofm.txt
          { echo '```'; cat report/ofm.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # What this run downloaded goes back to svr-net/eod. The other market's job may push first:
      # rebase and retry; a file both jobs updated (the shared series) keeps the version already
      # pushed, which holds the same days.
      - name: Push the new data to the EOD store (svr-net/eod)
        if: ${{ always() }}
        # A failure here (e.g. an expired EOD_TOKEN) is reported but does not stop the page's scan.
        continue-on-error: true
        run: |
          cd data/eoddata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "EOD store: nothing new"; exit 0; fi
          git commit -q -m "$MARKET data $(date -u +%Y-%m-%d)"
          for k in 1 2 3 4 5; do
            git pull -q --rebase -X ours origin main && git push -q origin HEAD:main && { echo "EOD store: pushed"; exit 0; }
            git rebase --abort 2>/dev/null || true
            sleep $((k * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.market }}-report
          path: report/
          retention-days: 14
      - name: Publish the scan to the page (results only, main branch)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/data
          M=$(echo "$MARKET" | tr 'A-Z' 'a-z')
          TRACK=web/data/track.json; [ "$M" = "uk" ] || TRACK="web/data/track-$M.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The other market's job may push first: rebase and retry.
          for k in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp report/ofm.json "web/data/$M.json"
            python3 tools/report/daily_email.py track report/ofm.json "$TRACK"
            git add "web/data/$M.json" "$TRACK"
            if git diff --cached --quiet; then echo "scan unchanged"; exit 0; fi
            git commit -q -m "$MARKET scan $(date -u +%Y-%m-%d) (results only)"
            git push -q origin HEAD:main && break
            sleep $((k * 5))
          done
          gh workflow run pages.yml --ref main
      - name: Email the daily report (scheduled runs, or when asked)
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.email) }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          M=$(echo "$MARKET" | tr 'A-Z' 'a-z')
          TRACK=web/data/track.json; [ "$M" = "uk" ] || TRACK="web/data/track-$M.json"
          python3 tools/report/daily_email.py send report/ofm.json "$TRACK"
