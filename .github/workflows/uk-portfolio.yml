# Downloads LSE daily bars from EODData (key in the EODDATA_API_KEY secret) into the runner's
# cache, reports what was downloaded (dates, symbols, rows) and backtests the model on it
# (results only). EODData's licence does not allow redistributing the raw data, so the prices
# stay in the cache and are never published.
name: UK portfolio

on:
  workflow_dispatch:
    inputs:
      universe: { description: 'Most traded shares to download', default: '250' }
      years: { description: 'Years of history (the plan serves about 9)', default: '9' }
      series: { description: 'Futures, index and currency series (EXCHANGE:CODE, comma separated)', default: 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP'
      probe: { description: 'Only list the exchanges and futures markets the key can see', type: boolean, default: false }

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test the model
        run: |
          pip install -r requirements.txt
          python model/test_orthofactor.py
      - name: Exchanges and futures markets available (metadata only)
        if: ${{ inputs.probe }}
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: node tools/eoddata/exchanges.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore the EODData cache
        if: ${{ !inputs.probe }}
        uses: actions/cache@v4
        with:
          path: data/eoddata
          key: eoddata-${{ github.run_id }}
          restore-keys: eoddata-
      - name: Download LSE bars
        if: ${{ !inputs.probe }}
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: node tools/eoddata/fetch.mjs --exchange LSE --universe "${{ inputs.universe || '250' }}" --years "${{ inputs.years || '9' }}" --currency GBP --out data/LSE.csv
      - name: Download futures, index and currency series
        if: ${{ !inputs.probe }}
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: node tools/eoddata/fetch_series.mjs --years 20 --out data/futures.csv --symbols "${{ inputs.series || 'EUREX:FY.C,EUREX:FX.C,EUREX:DY.C,EUREX:JD.C,LIFFE:L7.C,LIFFE:IB.C,LIFFE:XZ26,INDEX:SG2C,INDEX:XDB,FOREX:GBPUSD,FOREX:EURGBP' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary (no prices)
        if: ${{ !inputs.probe }}
        run: |
          {
            echo '```'
            echo "rows:    $(($(wc -l < data/LSE.csv) - 1))"
            echo "symbols: $(tail -n +2 data/LSE.csv | cut -d, -f2 | sort -u | wc -l)"
            echo "first:   $(tail -n +2 data/LSE.csv | cut -d, -f1 | sort | head -1)"
            echo "last:    $(tail -n +2 data/LSE.csv | cut -d, -f1 | sort | tail -1)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Backtest the model (results only)
        if: ${{ !inputs.probe }}
        run: |
          python model/run.py data/LSE.csv | tee model-report.txt
          { echo '```'; cat model-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Daily backtest with stop-loss and take-profit (results only)
        if: ${{ !inputs.probe }}
        run: |
          python model/run_daily.py data/LSE.csv 2>/dev/null | tee daily-report.txt
          { echo '```'; cat daily-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Model with futures inputs (results only)
        if: ${{ !inputs.probe }}
        run: |
          python model/run_futures.py data/LSE.csv data/futures.csv | tee futures-report.txt
          { echo '```'; cat futures-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
