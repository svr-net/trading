# The broker bridge's image, built on every change to it and published as
# ghcr.io/svr-net/trading-bridge (latest and the commit), stamped with its commit, for the NAS to pull
# (docker compose pull && docker compose up -d): the NAS builds nothing. The image holds only
# tools/ibkr and Python's packages; no keys or settings (they stay in the NAS's .env).
name: Bridge image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/ibkr/**'
      - 'docker/ibkr/Dockerfile.bridge'
      - '.github/workflows/bridge-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The short commit
        id: v
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ibkr/Dockerfile.bridge
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: |
            ghcr.io/svr-net/trading-bridge:latest
            ghcr.io/svr-net/trading-bridge:${{ steps.v.outputs.sha }}
