# The NAS's image, built here and never on the NAS: one container with IB Gateway, IBC and the Java bridge
# (docker/ibkr/Dockerfile.ibkr, stamped with its commit; made only when the bridge's checks pass). Published
# twice: in GitHub's registry (ghcr.io/svr-net/trading-ibkr, latest and the commit), and as one file per
# processor in the repository's "nas-images" release (trading-ibkr-amd64.tar.gz, -arm64), which a NAS whose
# Docker cannot reach the registry downloads over IPv4 and loads (docker/ibkr/ibkr-nas.sh). No keys or
# settings in the image (they stay in the NAS's .env).
name: Bridge image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/ibkr/java/**'
      - 'tools/ibkr/java-test/**'
      - 'docker/ibkr/Dockerfile.ibkr'
      - 'docker/ibkr/ibkr-start.sh'
      - 'docker/ibkr/gateway-run.sh'
      - 'docker/ibkr/Dockerfile.nas'
      - 'docker/ibkr/slim-rootfs.sh'
      - '.github/workflows/bridge-image.yml'
permissions:
  contents: write   # the nas-images release
  packages: write
concurrency:
  group: nas-images
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The short commit
        id: v
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          # Only main's images are "latest" (the NAS takes latest): a branch's build is tagged with its commit only.
          [ "$GITHUB_REF" = refs/heads/main ] && echo "main=1" >> "$GITHUB_OUTPUT" || echo "main=" >> "$GITHUB_OUTPUT"
      # One container for the NAS (docker/ibkr/ibkr-nas.sh): IB Gateway, IBC and the bridge together.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ibkr/Dockerfile.ibkr
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # The build cache keeps the system and IB Gateway layers byte for byte while the base image is the same, so
          # the NAS downloads only the bridge's small layers on an update (docker pull fetches the layers it lacks).
          cache-from: type=gha,scope=trading-ibkr
          cache-to: type=gha,mode=max,scope=trading-ibkr
          push: true
          tags: |
            ${{ steps.v.outputs.main && 'ghcr.io/svr-net/trading-ibkr:latest' || '' }}
            ghcr.io/svr-net/trading-ibkr:${{ steps.v.outputs.sha }}
      - name: The one container starts (IB Gateway's start script and the bridge, without a login)
        run: |
          set -euo pipefail
          img=ghcr.io/svr-net/trading-ibkr:${{ steps.v.outputs.sha }}
          docker pull -q --platform linux/amd64 "$img"
          mkdir -p /tmp/tls && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/tls/key.pem -out /tmp/tls/cert.pem -subj /CN=localhost 2>/dev/null
          chmod 600 /tmp/tls/key.pem
          docker run -d --name ibkr-test -e TWS_USERID=nobody -e TWS_PASSWORD=x -e TRADING_MODE=paper -e BRIDGE_KEY=k \
            -v /tmp/tls:/certs:ro -e TLS_SRC_CERT=/certs/cert.pem -e TLS_SRC_KEY=/certs/key.pem -p 18765:8765 "$img"
          o='Origin: https://svr-net.github.io'
          for i in $(seq 1 45); do curl -skf -H "$o" https://127.0.0.1:18765/status -o status.json && break; sleep 2; done
          curl -skf -H "$o" -H 'X-Bridge-Key: k' https://127.0.0.1:18765/java -o java.json || true
          curl -skf -H "$o" -H 'X-Bridge-Key: k' https://127.0.0.1:18765/diag -o diag.json || true
          docker logs ibkr-test 2>&1 | tail -30
          echo "status: $(head -c 200 status.json)"; echo "java: $(cat java.json)"; echo "diag: $(jq -c '[.checks[] | {check, ok}]' diag.json)"
          jq -e '.bridge == true and .java == true and .version == "${{ steps.v.outputs.sha }}"' status.json
          jq -e '[.checks[].check] | index("IB Gateway port") != null' diag.json
          [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:18765/live)" = 200 ] || { echo "/live is not 200"; exit 1; }
          jq -e '.java == true and .version == "${{ steps.v.outputs.sha }}" and (.api | startswith("server version"))' java.json
          [ "$(curl -sk -o /dev/null -w '%{http_code}' -H "$o" https://127.0.0.1:18765/java)" = 401 ] || { echo "/java answered without the key"; exit 1; }
          docker exec ibkr-test pgrep -f ibcstart.sh >/dev/null || docker exec ibkr-test pgrep -f ibcalpha >/dev/null || { echo "IBC not running"; exit 1; }
          [ "$(docker exec ibkr-test sh -c 'ps -o user= -p $(pgrep -f bridge.jar | head -1)')" != root ] || { echo "the bridge runs as root"; exit 1; }
          ! docker exec ibkr-test sh -c 'test -e /opt/bridge || test -e /app/tools' || { echo "the Python bridge is still in the image"; exit 1; }
          docker rm -f ibkr-test >/dev/null
      - name: IBKR's Java client sources (GPL-3), for developing the bridge against them
        run: |
          docker buildx build --platform linux/amd64 --target javaclient-src --output type=local,dest=javaclient-src -f docker/ibkr/Dockerfile.ibkr .
          tar czf twsapi-javaclient.tgz -C javaclient-src javaclient && ls -l twsapi-javaclient.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: twsapi-javaclient
          path: twsapi-javaclient.tgz
          retention-days: 30
      - name: One file per image and processor
        if: steps.v.outputs.main
        run: |
          set -euo pipefail
          mkdir -p out
          for name in trading-ibkr; do
            # Each processor's image by its own digest (pulling the tag a second time for another platform fails on
            # the newer runners: "unable to create manifests file: content digest not found", 17 Nov).
            ref="ghcr.io/svr-net/$name:${{ steps.v.outputs.sha }}"
            for arch in amd64 arm64; do
              digest=$(docker buildx imagetools inspect --raw "$ref" | jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' | head -1)
              [ -n "$digest" ] || { echo "no $arch image for $ref"; exit 1; }
              docker pull -q "ghcr.io/svr-net/$name@$digest"
              docker tag "ghcr.io/svr-net/$name@$digest" "ghcr.io/svr-net/$name:latest"
              docker save "ghcr.io/svr-net/$name:latest" | gzip -6 > "out/$name-$arch.tar.gz"
              docker image rm -f "ghcr.io/svr-net/$name@$digest" "ghcr.io/svr-net/$name:latest" >/dev/null
            done
          done
          # The same image in two parts for a NAS without the registry (ibkr-nas.sh): the base (the system and IB
          # Gateway, named by its layers, so a NAS downloads it only when it changed) and the bridge's few files
          # (bridge.jar, its scripts and Dockerfile.nas, from which the NAS makes the image by copying only).
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --target base --cache-from type=gha,scope=trading-ibkr \
              -f docker/ibkr/Dockerfile.ibkr -t trading-ibkr-base:build --load .
            key=$(docker image inspect -f '{{json .RootFS.Layers}}' trading-ibkr-base:build | sha256sum | cut -c1-12)
            docker tag trading-ibkr-base:build "trading-ibkr-base:$key"
            docker save "trading-ibkr-base:$key" | gzip -6 > "out/trading-ibkr-base-$arch.tar.gz"
            echo "$key" > "out/trading-ibkr-base-$arch.key"
            docker image rm -f trading-ibkr-base:build "trading-ibkr-base:$key" >/dev/null
            echo "base $arch: $key"
          done
          mkdir -p bridge
          c=$(docker create --platform linux/amd64 "ghcr.io/svr-net/trading-ibkr:${{ steps.v.outputs.sha }}")
          docker cp "$c:/app/bridge.jar" bridge/bridge.jar && docker rm "$c" >/dev/null
          cp docker/ibkr/ibkr-start.sh bridge/ibkr-start.sh && cp docker/ibkr/gateway-run.sh bridge/run.sh
          cp docker/ibkr/Dockerfile.nas bridge/Dockerfile && echo "${{ steps.v.outputs.sha }}" > bridge/VERSION
          chmod 644 bridge/bridge.jar bridge/Dockerfile bridge/VERSION && chmod 755 bridge/ibkr-start.sh bridge/run.sh
          tar czf out/trading-ibkr-bridge.tar.gz -C bridge .
          # The NAS's way, checked here: the amd64 base loaded, the image made from it and the bridge's files with
          # Docker's classic builder (a Synology's), the same files and version as the registry's image
          key=$(cat out/trading-ibkr-base-amd64.key)
          gunzip -c out/trading-ibkr-base-amd64.tar.gz | docker load -q
          mkdir -p nascheck && tar xzf out/trading-ibkr-bridge.tar.gz -C nascheck
          a=(--build-arg "BASE=trading-ibkr-base:$key" --build-arg "VERSION=$(cat nascheck/VERSION)" -t nas-made nascheck)
          DOCKER_BUILDKIT=0 docker build -q "${a[@]}" || { echo "no classic builder on this runner: BuildKit"; docker build -q "${a[@]}"; }
          docker run --rm --entrypoint /bin/bash nas-made -c 'test -f /app/bridge.jar && test -x /app/ibkr-start.sh && test -x /app/scripts/run.sh && test -x /app/java && echo "made on the NAS: bridge $BRIDGE_VERSION"' | grep -q "bridge ${{ steps.v.outputs.sha }}"
          [ "$(docker image inspect -f '{{json .Config.Cmd}}' nas-made)" = '["/app/ibkr-start.sh"]' ]
          docker image rm -f nas-made "trading-ibkr-base:$key" >/dev/null
          ls -l out
      - name: The nas-images release
        if: steps.v.outputs.main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          note="The NAS's images, built from ${{ steps.v.outputs.sha }} (docker/ibkr/ibkr-nas.sh downloads them when the registry does not answer)."
          gh release view nas-images >/dev/null 2>&1 || gh release create nas-images --title "NAS images" --notes "$note" --latest=false
          gh release edit nas-images --notes "$note"
          gh release upload nas-images out/*.tar.gz out/*.key --clobber
