# Audit of the cached share bars (results only: counts, tickers, dates and ratios, never prices).
# Runs on pushes to its branch; reads the EOD store (svr-net/eod, as the live runs) and makes no requests.
name: Data audit

on:
  push:
    branches: [claude/data-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        market: [UK, US]
    env:
      MARKET: ${{ matrix.market }}
      EXCHANGES: ${{ matrix.market == 'US' && 'NYSE,NASDAQ' || 'LSE' }}
      POOL: ${{ matrix.market == 'US' && '2000' || '500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed from the runner's cache
        uses: actions/cache/restore@v4
        with:
          path: data/eoddata
          key: eoddata-${{ matrix.market }}-main-${{ github.run_id }}
          restore-keys: |
            eoddata-${{ matrix.market }}-main-
      - name: Set the cache's store aside
        run: if [ -d data/eoddata ]; then mv data/eoddata data/seed; fi
      - name: Check out the EOD store (svr-net/eod)
        uses: actions/checkout@v4
        with:
          repository: svr-net/eod
          token: ${{ secrets.EOD_TOKEN }}
          path: data/eoddata
          fetch-depth: 1
      - name: Add the files svr-net/eod lacks from the cache's store
        run: if [ -d data/seed ]; then cp -rn data/seed/. data/eoddata/; rm -rf data/seed; fi
      - name: Bars from the store (no requests)
        run: |
          set -o pipefail
          mkdir -p data
          echo 'date,ticker,open,high,low,close,volume' > data/stocks.csv
          for EX in $(echo "$EXCHANGES" | tr ',' ' '); do
            CUR=""; [ "$EX" = "LSE" ] && CUR="GBP"
            # The loader's messages name prices when it drops a share: only their counts are shown.
            node tools/eoddata/fetch.mjs --cached --skip-missing --exchange "$EX" --universe "$POOL" --years 9 --currency "$CUR" --out "data/$EX.csv" > fetch.log 2>&1 || true
            echo "$EX: kept $(($(wc -l < "data/$EX.csv") - 1)) bars; dropped for a move over 60%: $(grep -c 'unexplained move' fetch.log); too short: $(grep -c ' days, dropped' fetch.log); not in the store: $(grep -c 'skip ' fetch.log)"
            tail -n +2 "data/$EX.csv" >> data/stocks.csv
          done
      - name: Audit (results only)
        run: python3 tools/audit/data_audit.py data/stocks.csv | tee -a "$GITHUB_STEP_SUMMARY"
