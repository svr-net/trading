name: CI

# Pull requests run every check; Pages (on main) calls it for the site only: the same code passed
# its pull request's checks.
on:
  pull_request:
  workflow_call:
    inputs:
      site-only: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  native:
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The native tools on Alpine (docker/native/Dockerfile; cached layers): the strategy engine with every strategy and
      # back end, the loaders and the scan. The image is made only when every strategy passes its checks on a generated
      # market (no look-ahead, every back end the same, costs at the end; tools/check/strategy_check.sh) and the scan
      # its own (ofm_scan test: the account's split over the markets, the walk-forward choice).
      - uses: ./.github/actions/ofm-tools
        with:
          check: 'true'
      - name: The tools run from the image (ofm)
        run: |
          ofm ofm_scan test
          ofm ofm_strategy --list

  anmc:
    # The adaptive nested Monte Carlo against exact Black-Scholes answers (apps/ofm_anmc.cpp, docs/adaptive-nested-mc.md),
    # its differential network proxy on a book of 10 assets, and the network's fused kernels against double precision.
    # shell: bash runs with pipefail, so a failed check fails the step through the tee.
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and check (VaR, ES, EPE; Hermite degrees 1, 2, 4)
        shell: bash
        run: |
          cmake -S . -B build-anmc -DCMAKE_BUILD_TYPE=Release
          cmake --build build-anmc --target ofm_anmc -j
          build-anmc/ofm_anmc --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The differential network's fused kernels, their f32 reference against double precision
        shell: bash
        run: build-anmc/ofm_anmc --kernels --check --dump anmc-gpu.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The differential network proxy on 10 assets (against Hermite and a values-only network, exact values)
        shell: bash
        run: build-anmc/ofm_anmc --basket 10 --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The fused kernels' plan and the native build, for the browser tests
        uses: actions/upload-artifact@v4
        with:
          name: anmc
          path: |
            anmc-gpu.json
            build-anmc/ofm_anmc
          retention-days: 3

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The strategy engine as WebAssembly for the page's Lab (docker/wasm/Dockerfile): the toolchain's layers come
      # from GitHub's cache, so a strategy change rebuilds only its own layer.
      - uses: docker/setup-buildx-action@v3
      - name: The strategy engine as WebAssembly (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wasm/Dockerfile
          target: out
          outputs: type=local,dest=web/lab
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm
      - name: The Lab's cost tables
        run: cp tools/venues.txt tools/eoddata/aim.txt web/lab/ && ls -l web/lab
      - name: The WebAssembly engine gives the native engine's results (pull requests)
        if: ${{ !inputs.site-only }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build build -j4 --target ofm_strategy > /dev/null
          node tools/check/wasm_same.mjs build/ofm_strategy web/lab/ofm_strategy.js
      - name: The Lab's GPU kernel against the engine's double precision (tools/check/mcgpu_check.sh)
        if: ${{ !inputs.site-only }}
        shell: bash
        run: sh tools/check/mcgpu_check.sh build/ofm_strategy | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/
          if-no-files-found: error
      - name: The native engine, for the browser test of the Lab's GPU build
        if: ${{ !inputs.site-only }}
        uses: actions/upload-artifact@v4
        with:
          name: engine
          path: build/ofm_strategy
          retention-days: 3

  e2e:
    if: ${{ !inputs.site-only }}
    needs: [site, anmc]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Browser test (the page renders the published scans)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node web/tests/e2e.mjs
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: engine
      - name: The Lab's live settings on WebGPU (the GPU build against the native engine, Chromium's software GPU)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        shell: bash
        run: |
          chmod +x engine/ofm_strategy
          node web/tests/labgpu.mjs site/lab engine/ofm_strategy | grep -v '^  \[page\]' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: anmc
          path: anmc
      - name: The differential network's fused kernels on WebGPU (Chromium's software GPU, against the C++ reference)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        shell: bash
        run: node web/tests/anmcgpu.mjs anmc/anmc-gpu.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The adaptive nested Monte Carlo in the browser (its WebAssembly builds, the network trained on WebGPU)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        shell: bash
        run: |
          chmod +x anmc/build-anmc/ofm_anmc
          node web/tests/anmclab.mjs site/lab anmc/build-anmc/ofm_anmc | tee -a "$GITHUB_STEP_SUMMARY"
