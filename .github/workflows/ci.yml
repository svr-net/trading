name: CI

# Pull requests run every check; Pages (on main) calls it for the site only: the same code passed
# its pull request's checks.
on:
  pull_request:
  workflow_call:
    inputs:
      site-only: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  native:
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
          ./build/ofm_tests
      - name: No look-ahead (the model on a generated market, tools/check/leak.sh)
        run: sh tools/check/leak.sh build/ofm_research
      - name: The swing model on a generated market (tools/check/swing_leak.sh)
        run: sh tools/check/swing_leak.sh build/ofm_swing
      - name: The single-share model on a generated market (tools/check/single_leak.sh)
        run: sh tools/check/single_leak.sh build/ofm_single
      - name: The multi-day single-share model on a generated market (tools/check/hold_leak.sh)
        run: sh tools/check/hold_leak.sh build/ofm_hold
      - name: The UK model on a generated market (tools/check/uk_leak.sh)
        run: sh tools/check/uk_leak.sh build/ofm_uk
      - name: The UK model's orders through submit.py on a stand-in IBKR (tools/ibkr/test/levels.py)
        run: python3 tools/ibkr/test/levels.py

  bridge-update:
    # The restarter replacing the bridge with GitHub's newest image, on a stand-in NAS.
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/ibkr/test/update.sh

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/
          if-no-files-found: error

  e2e:
    if: ${{ !inputs.site-only }}
    needs: site
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Browser test (the page renders the published scans)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node web/tests/e2e.mjs
