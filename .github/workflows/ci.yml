name: CI

# Pull requests run every check; Pages (on main) calls it for the site only: the same code passed
# its pull request's checks.
on:
  pull_request:
  workflow_call:
    inputs:
      site-only: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  native:
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
          ./build/ofm_tests
      - name: No look-ahead (the model on a generated market, tools/check/leak.sh)
        run: sh tools/check/leak.sh build/ofm_research
      - name: The swing model on a generated market (tools/check/swing_leak.sh)
        run: sh tools/check/swing_leak.sh build/ofm_swing
      - name: The single-share model on a generated market (tools/check/single_leak.sh)
        run: sh tools/check/single_leak.sh build/ofm_single
      - name: The multi-day single-share model on a generated market (tools/check/hold_leak.sh)
        run: sh tools/check/hold_leak.sh build/ofm_hold
      - name: The UK model on a generated market (tools/check/uk_leak.sh)
        run: sh tools/check/uk_leak.sh build/ofm_uk
      - name: The UK model's orders through submit.py on a stand-in IBKR (tools/ibkr/test/levels.py)
        run: python3 tools/ibkr/test/levels.py
      - name: The daily-bars fetch gives way to the bridge's other steps (tools/ibkr/test/pause.py)
        run: python3 tools/ibkr/test/pause.py
      - name: The bridge's chart bars for the page (tools/ibkr/test/chart.py)
        run: python3 tools/ibkr/test/chart.py
      - name: The account's split over the markets (tools/scan/test_allocate.py)
        run: python3 tools/scan/test_allocate.py

  bridge-update:
    # The restarter replacing the bridge with GitHub's newest image, on a stand-in NAS.
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/ibkr/test/update.sh

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The model as WebAssembly for the page's Lab (docker/wasm/Dockerfile): the toolchain's layers come from
      # GitHub's cache, so a model change rebuilds only its own layer.
      - uses: docker/setup-buildx-action@v3
      - name: The model as WebAssembly (cached layers)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wasm/Dockerfile
          target: out
          outputs: type=local,dest=web/lab
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm
      - name: The Lab's cost tables
        run: cp tools/venues.txt tools/eoddata/aim.txt web/lab/ && ls -l web/lab
      - name: The WebAssembly model gives the native model's results (pull requests)
        if: ${{ !inputs.site-only }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build build -j4 --target ofm_uk > /dev/null
          node tools/check/wasm_same.mjs build/ofm_uk web/lab/ofm_uk.js
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/
          if-no-files-found: error

  e2e:
    if: ${{ !inputs.site-only }}
    needs: site
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Browser test (the page renders the published scans)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node web/tests/e2e.mjs
