name: CI

# Pull requests run every check; Pages (on main) calls it for the site only: the same code passed
# its pull request's checks.
on:
  pull_request:
  workflow_call:
    inputs:
      site-only: { type: boolean, default: false }

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.site-only }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    if: ${{ !inputs.site-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target ofm_tests
          ./build/ofm_tests

  wasm:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:4.0.10
    steps:
      - uses: actions/checkout@v4
      - name: Build the WebAssembly module
        run: |
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j"$(nproc)"
      - name: Node test
        if: ${{ !inputs.site-only }}
        run: node web/tests/wasm.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/
          if-no-files-found: error

  e2e:
    if: ${{ !inputs.site-only }}
    needs: wasm
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: web
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Browser test (the page on WebGPU, SwiftShader)
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node web/tests/e2e.mjs
