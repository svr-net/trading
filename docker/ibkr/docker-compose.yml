# IB Gateway (paper) and the page's bridge, on your own computer:
#   cp .env.example .env    (fill it in)
#   docker compose up -d --build
# then open https://svr-net.github.io/trading/ : its "Your broker" panel finds the bridge.
# Both listen on 127.0.0.1 only: nothing is reachable from outside this computer.
services:
  ib-gateway:
    # The community image that runs IB Gateway without a screen and logs in by itself (IBC).
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: always
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:59 PM"
      TZ: ${TZ:-Europe/London}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:4002:4004"   # the paper API, for tools/ibkr/submit.py run by hand
      - "127.0.0.1:5900:5900"   # VNC, to watch the gateway's login (only if VNC_SERVER_PASSWORD is set)

  bridge:
    build:
      context: ../..
      dockerfile: docker/ibkr/Dockerfile.bridge
    restart: always
    depends_on: [ib-gateway]
    environment:
      BRIDGE_KEY: ${BRIDGE_KEY}
      EOD_READ_TOKEN: ${EOD_READ_TOKEN}
      CAPITAL: ${CAPITAL:-5000}
      IB_HOST: ib-gateway
      IB_PORT: "4004"           # the image's paper API for other containers (4003: live)
      BIND: 0.0.0.0
      ALLOWED_ORIGIN: https://svr-net.github.io
      AUTO_MARKETS: ${AUTO_MARKETS:-}
      HISTORY_DIR: /data/history
    volumes:
      - ./history:/data/history
    ports:
      - "127.0.0.1:8765:8765"
